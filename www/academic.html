<!doctype html>
<!--
  VU Academic Hub - one self-contained HTML file, no build step, no bundled data.

  What it is: a student companion for Varendra University (Rajshahi). Notices, the academic calendar,
  the programme catalogue with full curricula, department documents, a CGPA calculator and official links.

  Data: everything is read live from the official site https://vu.edu.bd and cached on the device.
  vu.edu.bd does not allow cross-origin reads, so a browser build reads it through the r.jina.ai
  reader (X-Return-Format: html). When Capacitor's CapacitorHttp is present (native build) the
  site is read directly. Hosts this app talks to: vu.edu.bd and r.jina.ai (GET only).

  Stored on the device (localStorage): theme and layout, the selected department, CGPA inputs,
  and a cache of the last successful reads. Nothing is sent anywhere else.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="Notices, academic calendar, programmes and a CGPA calculator for Varendra University students.">
<title>VU Academic Hub</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2318181b'/%3E%3Cpath d='M16 8 6 13l10 5 10-5-10-5Z' fill='none' stroke='%23fff' stroke-width='2' stroke-linejoin='round'/%3E%3Cpath d='M10 16v5c0 1.5 2.7 3 6 3s6-1.5 6-3v-5' fill='none' stroke='%23fff' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
<script>
// Apply the saved theme before first paint to avoid a flash.
(function () {
  var theme = 'system';
  try { theme = localStorage.getItem('vuhub.theme') || 'system'; } catch (e) {}
  var dark = theme === 'dark' || (theme !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
  if (dark) document.documentElement.classList.add('dark');
})();
</script>

/* ==========================================================================

}

function setSync() {

  else if (SYNC.error) { s = SYNC.hadCache ? 'cached' : 'offline'; t = (SYNC.hadCache ? 'Showing saved data' : 'Not connected') + stamp; el.title = SYNC.error; }
  else if (SYNC.lastOk) { s = 'live'; t = 'Up to date' + stamp; el.title = ''; }

  el.dataset.s = s; el.innerHTML = `<i></i><span class="truncate">${esc(t)}</span>`;

/**
 * Cache-first read. Returns {data, at, stale, error}. Fresh cache is returned without a request;
 * stale cache is returned immediately when the request fails.

async function load(bucket, key, path, parse, { force = false, ttl } = {}) {
  const cached = cacheGet(bucket, key);
  const fresh = cached && Date.now() - cached.at < (ttl ?? TTL[bucket]);
  if (fresh && !force) return { data: cached.data, at: cached.at, stale: false };
  SYNC.pending += 1; setSync();
  try {
    const html = await fetchHtml(path);
    const data = parse(html);
    cachePut(bucket, key, { data });
    SYNC.lastOk = Date.now(); SYNC.error = '';
    return { data, at: Date.now(), stale: false };
  } catch (e) {
    SYNC.error = e.message || 'Request failed'; SYNC.hadCache = Boolean(cached);
    if (cached) return { data: cached.data, at: cached.at, stale: true, error: SYNC.error };
    return { data: null, at: 0, stale: false, error: SYNC.error };
  } finally { SYNC.pending -= 1; setSync(); }
}

  if (/publication of/i.test(a)) return 'result';

}

}
function currentSession(events, today = todayISO()) {

  events.forEach((e) => { const s = by.get(e.session) || { name: e.session, first: e.start, last: e.end, begin: '' }; s.first = e.start < s.first ? e.start : s.first; s.last = e.end > s.last ? e.end : s.last; if (/beginning of classes/i.test(e.activity)) s.begin = e.start; by.set(e.session, s); });

  const running = list.filter((s) => s.begin <= today && today <= s.last).pop();
  return running ? { ...running, state: 'running' } : (list.find((s) => s.begin > today) ? { ...list.find((s) => s.begin > today), state: 'next' } : null);
}

/* ---- CGPA calculator ---- */
const num = (v) => { const n = parseFloat(v); return Number.isFinite(n) ? n : 0; };
function gradeFor(marks) {
  const m = parseFloat(marks); if (!Number.isFinite(m) || m < 0 || m > 100) return null;
  return GRADES.find((g) => m >= g[3]);
}
function calc() {
  const rows = prefs.rows.filter((r) => num(r.credits) > 0);
  const cr = rows.reduce((s, r) => s + num(r.credits), 0), pts = rows.reduce((s, r) => s + num(r.credits) * (GP[r.grade] ?? 0), 0);
  const gpa = cr ? pts / cr : 0, cc = num(prefs.credits), cg = num(prefs.cgpa);
  const total = cc + cr, projected = total ? (cg * cc + pts) / total : 0;
  return { cr, gpa, total, projected, delta: cc ? projected - cg : null };
}
function targetMsg() {
  const cc = num(prefs.credits), cg = num(prefs.cgpa), want = num(prefs.desired), fut = num(prefs.future);
  if (want < 0 || want > 4) return { tone: 'bad', t: 'The desired CGPA must be between 0.00 and 4.00.' };
  if (fut <= 0) return { tone: 'bad', t: 'Enter the credits you still have to take.' };
  const need = (want * (cc + fut) - cg * cc) / fut;
  if (need > 4) return { tone: 'bad', t: `Not reachable: you would need ${need.toFixed(2)} on a 4.00 scale. Add more future credits or lower the target.` };
  if (need <= 0) return { tone: 'ok', t: `Already secured: a GPA of 0.00 in the next ${fut} credits still keeps you at ${want.toFixed(2)} or above.` };
  const g = GRADES.slice().reverse().find((x) => x[1] >= need - 1e-9);
  return { tone: '', t: `You need a GPA of ${need.toFixed(2)} over the next ${fut} credits${g ? ` (about ${g[0]} or better in every course)` : ''}.` };
}
