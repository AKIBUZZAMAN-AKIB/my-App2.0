<!doctype html>
<!-- Example custom HTML background for Home ("Constellation").
     Home draws a background like this behind the widgets in a sandboxed iframe:
     scripts run, but there is no network, no taps and no access to the app's data.
     It follows the phone's light/dark setting through prefers-color-scheme, and
     stays still for prefers-reduced-motion or when Home's motion is off
     (Home sets window.HOME_MOTION = 'off'). -->
<html>
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: light dark; --bg1: #eef2ff; --bg2: #f0fdfa; --dot: 79, 70, 229; }
  @media (prefers-color-scheme: dark) { :root { --bg1: #0b1020; --bg2: #0a1a1a; --dot: 165, 180, 252; } }
  html, body { margin: 0; height: 100%; overflow: hidden; background: linear-gradient(160deg, var(--bg1), var(--bg2)); }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  const c = document.getElementById('c'), x = c.getContext('2d');
  const still = () => window.HOME_MOTION === 'off' || matchMedia('(prefers-reduced-motion: reduce)').matches;
  let w = 0, h = 0, dots = [];
  function size() {
    const r = devicePixelRatio || 1; w = innerWidth; h = innerHeight;
    c.width = w * r; c.height = h * r; x.setTransform(r, 0, 0, r, 0, 0);
    const n = Math.round(Math.min(70, (w * h) / 9000));
    dots = Array.from({ length: n }, (_, i) => ({ x: ((i * 97) % 100) / 100 * w, y: ((i * 61) % 100) / 100 * h,
      vx: (((i * 37) % 13) - 6) / 60, vy: (((i * 53) % 11) - 5) / 60, r: 1 + (i % 3) * 0.6 }));
  }
  function frame() {
    const rgb = getComputedStyle(document.documentElement).getPropertyValue('--dot').trim();
    x.clearRect(0, 0, w, h);
    for (const d of dots) {
      if (!still()) { d.x = (d.x + d.vx + w) % w; d.y = (d.y + d.vy + h) % h; }
      x.beginPath(); x.arc(d.x, d.y, d.r, 0, Math.PI * 2); x.fillStyle = `rgba(${rgb}, .7)`; x.fill();
    }
    for (let i = 0; i < dots.length; i++) for (let j = i + 1; j < dots.length; j++) {
      const a = dots[i], b = dots[j], dist = Math.hypot(a.x - b.x, a.y - b.y);
      if (dist < 110) { x.strokeStyle = `rgba(${rgb}, ${0.28 * (1 - dist / 110)})`; x.lineWidth = 1; x.beginPath(); x.moveTo(a.x, a.y); x.lineTo(b.x, b.y); x.stroke(); }
    }
    requestAnimationFrame(frame);
  }
  addEventListener('resize', size); size(); frame();
</script>
</body>
</html>
