const icon = (name, cls = '') =>

/* ==========================================================================
   NativeKit adapter.

   Every call below is a documented façade member of the pinned engine
   (0.5.2-public) in capacitor-agnt/bridge/nativekit.ts. Positions and return
   shapes are copied from that file, not guessed:

     supported()                     sync boolean
     checkAvailability()             {available, reason, abi, is64Bit, engineGeneration}
     initialize({dbPath, workspacePath, authProfilesPath})
     onEvent(cb)                     -> Promise<Remove>; envelope {eventType, payloadJson}
     listSessions(agentId)           -> {sessionsJson}
     loadSession(sessionKey, agentId)-> {messagesJson}
     resumeSession({sessionKey, agentId})
     listCronJobs()                  -> {jobsJson}
     updateCronJob(id, patchObject)  -> patch is serialised for you
     runCronJob(jobId) / listCronRuns(jobId, limit)
     handleWake(source)              -> {ran, failed, surfaced, summary}
     listSkills()                    -> {skillsJson}
     startSkill(skillId, config?, provider?) — id only here, so the engine uses
                                        the default provider; a skill runs in its
                                        OWN session and must not hijack the chat
     memory.list({prefix, limit})    -> parsed JSON array of keys
     memory.search({query, limit})   -> {results, truncated}
     invokeTool('list_files', {...}) -> {resultJson: {entries, truncated}}
     getRuntimeConfig()              -> parsed object (defaultProvider, defaultModels, autoRouting…)
     getAuthStatus(provider)         -> {hasKey, masked, provider}
     getWakeStatus()                 -> BackgroundWakeStatus (jobScheduled, mechanism, nextRunApproxMs, engineInitialized…)
     getSchedulerConfig()            -> {...native, scheduler, heartbeat}
     scheduleBackgroundWakes(min)    -> BackgroundWakeResult (intervalMinutes actually granted)
     cancelBackgroundWakes()
     loadSurfacedMessages(limit)     -> {messagesJson, count, unread, lastWakeSummary…}
     clearSurfacedMessages()
     preferences.getJSON(key) / secureStorage.get(key)

   Two things are deliberately NOT called here:

   * `connectMcp()` — its first act after the handshake is `agent.startMcp(...)`,
     which is ADDITIVE in the engine. The chat screen already registers that
     catalogue at boot, so a second surface calling it would append duplicate
     tool definitions that no client answers. This widget therefore reads the
     same saved servers and tokens and shows their health without owning a
     catalogue.
   * approval-gated tools (memory_store/forget, write_file, execute_command…).
     They block the engine until `respondToApproval` answers, and a home widget
     has no approval UI, so it only ever reads.
   ========================================================================== */
const AGENT_ID = 'main';
const AGENT_PATHS = Object.freeze({
  dbPath: 'files://agent/agent.db',
  workspacePath: 'files://agent/workspace',
  authProfilesPath: 'files://agent/auth-profiles.json',
});
const MCP_SERVERS_KEY = 'nativekit.agent.mcp.servers.v1';
const MCP_TOKEN_PREFIX = 'nativekit.agent.mcp.token.';
const KEY_PROVIDERS = ['anthropic', 'openai', 'gemini', 'openrouter', 'ovhcloud', 'opencode_zen', 'llm7', 'kilo', 'pollinations', 'aihorde', 'webllm'];
const PROVIDER_LABEL = {
  anthropic: 'Anthropic', openai: 'OpenAI', gemini: 'Gemini', openrouter: 'OpenRouter', ovhcloud: 'OVHcloud',
  opencode_zen: 'OpenCode Zen', llm7: 'LLM7', kilo: 'Kilo', pollinations: 'Pollinations', aihorde: 'AI Horde', webllm: 'WebLLM',
};
const WAKE_FLOOR_MIN = 15;

const kit = () => (typeof window !== 'undefined' ? window.NativeKit : undefined);
const agentOf = () => kit()?.agent;

const Native = {
  /** Sync: the façade exposes supported() as a plain boolean. */
  supported() {
    const agent = agentOf();
    if (!agent) return false;
    try { return typeof agent.supported === 'function' ? !!agent.supported() : true; } catch { return false; }
  },
  checkAvailability() { return agentOf().checkAvailability(); },
  initialize() { return agentOf().initialize(AGENT_PATHS); },
  onEvent(cb) { return agentOf().onEvent(cb); },
  async listSessions() {
    const r = await agentOf().listSessions(AGENT_ID);
    const list = parse(r?.sessionsJson, []);
    return Array.isArray(list) ? list : [];
  },
  async loadSession(sessionKey) {
    const r = await agentOf().loadSession(sessionKey, AGENT_ID);
    const list = parse(r?.messagesJson, []);
    return Array.isArray(list) ? list : [];
  },
  resumeSession(sessionKey) { return agentOf().resumeSession({ sessionKey, agentId: AGENT_ID }); },
  async listJobs() {
    const r = await agentOf().listCronJobs();
    const list = parse(r?.jobsJson, []);
    return Array.isArray(list) ? list : [];
  },
  updateJob(id, patch) { return agentOf().updateCronJob(id, patch); },
  runJob(id) { return agentOf().runCronJob(id); },
  async listRuns(jobId, limit = 5) {
    const r = await agentOf().listCronRuns(jobId, limit);
    const list = parse(r?.runsJson, []);
    return Array.isArray(list) ? list : [];
  },
  handleWake(source) { return agentOf().handleWake(source || 'home_widget'); },
  async listSkills() {
    const r = await agentOf().listSkills();
    const list = parse(r?.skillsJson, []);
    return Array.isArray(list) ? list : [];
  },
  /** startSkill(skillId, config = {}, provider?) — omitting provider is the
      documented way to let the engine use its configured default. */
  startSkill(skillId) { return agentOf().startSkill(skillId); },
  async memoryList() {
    const agent = agentOf();
    const list = agent.memory?.list ? await agent.memory.list({ prefix: '', limit: 50 }) : null;
    if (Array.isArray(list)) return list.filter((k) => typeof k === 'string');
    const r = await agent.invokeTool('memory_list', { prefix: '', limit: 50 });
    const fallback = parse(r?.resultJson, []);
    return Array.isArray(fallback) ? fallback.filter((k) => typeof k === 'string') : [];
  },
  memorySearch(query) {
    const agent = agentOf();
    if (agent.memory?.search) return agent.memory.search({ query, limit: 5 });
    return agent.invokeTool('memory_search', { query, limit: 5 }).then((r) => parse(r?.resultJson, { results: [] }));
  },
  async listFiles(path = '.') {
    const r = await agentOf().invokeTool('list_files', { path });
    const result = parse(r?.resultJson, null);
    return result && typeof result === 'object' ? result : { entries: [] };
  },
  getRuntimeConfig() { return agentOf().getRuntimeConfig(); },
  getAuthStatus(provider) { return agentOf().getAuthStatus(provider); },
  getWakeStatus() { return agentOf().getWakeStatus(); },
  getSchedulerConfig() { return agentOf().getSchedulerConfig(); },
  scheduleWakes(minutes) { return agentOf().scheduleBackgroundWakes(minutes); },
  cancelWakes() { return agentOf().cancelBackgroundWakes(); },
  async loadSurfaced(limit = 30) {
    const r = await agentOf().loadSurfacedMessages(limit);
    const list = parse(r?.messagesJson, []);
    return {
      list: Array.isArray(list) ? list : [],
      count: Number(r?.count) || (Array.isArray(list) ? list.length : 0),
      unread: Number(r?.unread) || 0,
      lastWakeAt: r?.lastWakeAt ?? null,
      lastWakeSummary: r?.lastWakeSummary ?? null,
      supported: r?.supported !== false,
      reason: r?.reason ?? null,
    };
  },
  clearSurfaced() { return agentOf().clearSurfacedMessages(); },
  /* Host data for the glance strip. Each one is guarded because the app config
     can disable a feature, and `feature()` throws when it is off. */
  appInfo() {
    const app = kit()?.app;
    if (!app?.info) throw new Error('app.info() is not available in this build.');
    return app.info();
  },
  networkStatus() {
    const network = kit()?.network;
    if (!network?.status) throw new Error('networkStatus is not enabled in this build.');
    return network.status();
  },
  locationCurrent() {
    const location = kit()?.location;
    if (!location?.current) throw new Error('location is not enabled in this build.');
    return location.current({ enableHighAccuracy: false, timeout: 12000 });
  },
  requestLocation() {
    const permissions = kit()?.permissions;
    if (!permissions?.requestLocation) return null;
    return permissions.requestLocation(true);
  },
  httpGet(url) {
    const http = kit()?.http;
    if (!http?.get) throw new Error('NativeKit.http is not available in this build.');
    return http.get(url);
  },
  /* The chat screen's own storage keys, read (never written) by this page. */
  async mcpConfig() {
    const prefs = kit()?.preferences;
    const secure = kit()?.secureStorage;
    const servers = prefs?.getJSON ? parse(await prefs.getJSON(MCP_SERVERS_KEY), []) : [];
    const list = (Array.isArray(servers) ? servers : []).filter((s) => s && typeof s.name === 'string' && typeof s.url === 'string');
    const rows = [];
    for (const server of list) {
      let hasToken = false;
      try { hasToken = !!(secure?.get && (await secure.get(MCP_TOKEN_PREFIX + server.name))); } catch { hasToken = false; }
      rows.push({ name: server.name, url: server.url, protocolVersion: server.protocolVersion || 'auto', alwaysAsk: server.alwaysAsk !== false, hasToken });
    }
    return rows;
  },
};

/* ==========================================================================
   Data — one slot per widget type, each with its own load/error state.
   ========================================================================== */
const data = {
  mode: 'demo',              // demo | live | error
  net: null, netError: '', app: null, weatherError: '',
  ready: false,
  detail: '',                // availability reason / boot error
  engineInitialized: null,
  sessions: null, jobs: null, runs: {}, memory: null, router: null,
  mcp: null, files: null, skills: null, wake: null, sched: null,
  surfaced: null, events: [],
  errors: {},
  updatedAt: {},
  loading: {},
  eventCount: [],            // {at, n} buckets for the sparkline
};

const loaders = {
  async sessions() {
    const list = await Native.listSessions();
    list.sort((a, b) => (Number(b?.updatedAt) || 0) - (Number(a?.updatedAt) || 0));
    data.sessions = list;
    // one extra call: the newest conversation's last line, for the preview
    if (list[0]?.sessionKey) {
      try {
        const messages = await Native.loadSession(list[0].sessionKey);
        data.sessions[0] = { ...list[0], preview: lastAssistantText(messages) };
      } catch { /* preview is optional */ }
    }
  },
  async jobs() {
    const list = await Native.listJobs();
    list.sort((a, b) => (Number(a?.nextRunAt) || Infinity) - (Number(b?.nextRunAt) || Infinity));
    data.jobs = list;
    const top = list.slice(0, 3);
    for (const job of top) {
      try { data.runs[job.id] = (await Native.listRuns(job.id, 1))[0] || null; } catch { data.runs[job.id] = null; }
    }
  },
  async skills() { data.skills = await Native.listSkills(); },
  async memory() { data.memory = await Native.memoryList(); },
  async files() {
    const result = await Native.listFiles('.');
    if (result?.error) throw new Error(String(result.error));
    const entries = Array.isArray(result?.entries) ? result.entries : [];
    entries.sort((a, b) => (a.type === b.type ? String(a.name).localeCompare(String(b.name)) : a.type === 'directory' ? -1 : 1));
    data.files = { entries, truncated: !!result.truncated };
  },
  async router() {
    const config = (await Native.getRuntimeConfig()) || {};
    const auth = {};
    await Promise.all(KEY_PROVIDERS.map(async (provider) => {
      try { auth[provider] = await Native.getAuthStatus(provider); } catch (e) { auth[provider] = { hasKey: false, error: errText(e) }; }
    }));
    data.router = { config, auth };
  },
  async mcp() { data.mcp = await Native.mcpConfig(); },
  async wake() {
    const [status, sched] = await Promise.all([
      Native.getWakeStatus().catch((e) => ({ supported: false, reason: errText(e) })),
      Native.getSchedulerConfig().catch(() => null),
    ]);
    data.wake = status;
    data.sched = sched;
    if (status && typeof status.engineInitialized === 'boolean') data.engineInitialized = status.engineInitialized;
  },
  async inbox() { data.surfaced = await Native.loadSurfaced(30); },
};

function lastAssistantText(messages) {
  for (let i = messages.length - 1; i >= 0; i -= 1) {
    const message = messages[i];
    if (!message || message.role !== 'assistant') continue;
    const content = message.content;
    if (typeof content === 'string' && content.trim()) return clip(content, 120);
    if (Array.isArray(content)) {
      const text = content.filter((p) => p && p.type === 'text').map((p) => p.text).join(' ').trim();
      if (text) return clip(text, 120);
    }
  }
  return '';
}

/** Load one type (or several); errors stay attached to that widget only. */
async function read(...keys) {
  if (data.mode !== 'live') return;
  await Promise.all(keys.map(async (key) => {
    const loader = loaders[key];
    if (!loader) return;
    data.loading[key] = true;
    try {
      await loader();
      delete data.errors[key];
      data.updatedAt[key] = now();
    } catch (e) {
      data.errors[key] = errText(e);
    } finally {
      delete data.loading[key];
    }
  }));
  keys.forEach((key) => paint(key));
  paintChrome();
  updateGlanceCard('engine');
}

/** Which widget types show a given data slot. */
const SLOT_TYPES = {
  sessions: ['chat'], jobs: ['automations'], skills: ['skills'], memory: ['memory'],
  files: ['files'], router: ['router'], mcp: ['mcp'], wake: ['wake'], inbox: ['inbox'],
};

function paint(slot) {
  (SLOT_TYPES[slot] || []).forEach((type) => repaintType(type));
}

function repaintType(type) {
  $$(`.widget[data-type="${type}"]`).forEach((el) => {
    const w = find(el.dataset.id);
    if (!w) return;
    el.querySelector('.w-body').innerHTML = TYPES[type].body(w);
    const foot = el.querySelector('.w-foot');
    if (foot) foot.innerHTML = TYPES[type].foot(w);
    el.querySelector('.w-status').dataset.tone = typeTone(type);
  });
}

function typeTone(type) {
  if (data.mode === 'demo') return 'warn';
  if (data.mode === 'error') return 'off';
  const slot = Object.keys(SLOT_TYPES).find((s) => SLOT_TYPES[s].includes(type));
  if (slot && data.errors[slot]) return 'warn';
  return 'ok';
}

const ORDER = ['chat', 'automations', 'memory', 'router', 'mcp', 'files', 'skills', 'wake', 'logs', 'inbox'];

function extensionOf(name, type) {
  if (type === 'directory') return 'dir';
  const parts = String(name || '').split('.');
  return parts.length > 1 ? parts.pop().slice(0, 3) : 'file';
}

function scheduleText(schedule) {
  if (!schedule || typeof schedule !== 'object') return 'no schedule';
  if (schedule.kind === 'every') {
    const minutes = Math.round((Number(schedule.everyMs) || 0) / 60000);
    return minutes >= 60 && minutes % 60 === 0 ? `every ${minutes / 60} h` : `every ${minutes} min`;
  }
  if (schedule.kind === 'at') return `once at ${clockOf(schedule.atMs)}`;
  return String(schedule.kind || 'custom');
}

function bucketSeries(count) {
  // events per minute for the last `count` minutes
  const buckets = new Array(count).fill(0);
  const minute = 60_000;
  const start = now() - count * minute;
  data.events.forEach((e) => {
    if (e.at < start) return;
    const index = clamp(Math.floor((e.at - start) / minute), 0, count - 1);
    buckets[index] += 1;
  });
  return buckets;
}

/* small shared renderers ---------------------------------------------------- */
function skeleton(rows) {
  return `<div class="rows">${Array.from({ length: rows }, (_, i) =>
    `<div class="row"><div style="width:100%"><span class="skel" style="width:${60 - i * 12}%"></span></div></div>`).join('')}</div>`;
}

function sparkline(series) {
  const w = 120, h = 30;
  const max = Math.max(...series, 1);
  const min = Math.min(...series, 0);
  const pts = series.map((v, i) => {
    const x = series.length === 1 ? 0 : (i / (series.length - 1)) * w;
    const y = h - ((v - min) / (max - min || 1)) * (h - 4) - 2;
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  });
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">
    <polygon class="area" points="0,${h} ${pts.join(' ')} ${w},${h}"/>
    <polyline class="line" points="${pts.join(' ')}"/>
  </svg>`;
}

/* ==========================================================================
   Layout state (unchanged from v1, plus the new inbox type)
   ========================================================================== */
const STORE_KEY = 'home.widgets.v1';
const HINT_KEY = 'home.widgets.hint';

const defaultLayout = () => [
  { id: uid(), type: 'chat', w: 4, h: 2 },
  { id: uid(), type: 'automations', w: 2, h: 2 },
  { id: uid(), type: 'memory', w: 2, h: 2 },
  { id: uid(), type: 'router', w: 4, h: 2 },
  { id: uid(), type: 'mcp', w: 2, h: 2 },
  { id: uid(), type: 'wake', w: 2, h: 2 },
  { id: uid(), type: 'files', w: 2, h: 2 },
  { id: uid(), type: 'skills', w: 2, h: 2 },
];

function normalize(list) {
  const seen = new Set();
  return (Array.isArray(list) ? list : [])
    .filter((w) => w && TYPES[w.type])
    .map((w) => {
      const type = TYPES[w.type];
      let id = typeof w.id === 'string' && w.id ? w.id : uid();
      while (seen.has(id)) id = uid();
      seen.add(id);
      return {
        id,
        type: w.type,
        w: clamp(Math.round(Number(w.w) || type.sizes[0][0]), type.min[0], type.max[0]),
        h: clamp(Math.round(Number(w.h) || type.sizes[0][1]), type.min[1], type.max[1]),
        opts: { ...type.defaultOpts, ...(w.opts && typeof w.opts === 'object' ? w.opts : {}) },
      };
    });
}

let state = [];
try {
  const raw = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
  state = raw ? normalize(raw) : [];
} catch { state = []; }
if (!state.length) state = normalize(defaultLayout());

function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch { /* private mode */ }
}
const find = (id) => state.find((w) => w.id === id);
const cols = () => (window.innerWidth >= 1024 ? 8 : window.innerWidth >= 740 ? 6 : 4);

/* ==========================================================================
   Render
   ========================================================================== */
const grid = $('#grid');
let editMode = false;
let openedFrom = null;

const sizeClass = (h) => (h <= 2 ? 'sm' : h === 3 ? 'md' : 'lg');

function widgetNode(w) {
  const type = TYPES[w.type];
  const el = document.createElement('article');
  el.className = 'widget';
  el.dataset.id = w.id;
  el.dataset.type = w.type;
  el.dataset.size = sizeClass(w.h);
  el.dataset.mode = data.mode;
  el.setAttribute('role', 'listitem');
  el.setAttribute('tabindex', '0');
  el.setAttribute('aria-label', `${type.label} widget. ${type.desc} Long-press, or press the ••• button, for its store.`);
  el.style.setProperty('--tint-src', `var(--${type.tint})`);
  el.style.gridColumn = `span ${Math.min(w.w, cols())}`;
  el.style.gridRow = `span ${w.h}`;

  el.innerHTML = `
    <div class="w-head">
      <span class="w-ico">${icon(type.icon)}</span>
      <div class="w-titles">
        <div class="w-name">${esc(type.label)}</div>
        <div class="w-sub">${esc(type.sub)}</div>
      </div>
      <span class="w-status" data-tone="${typeTone(w.type)}" role="img" aria-label="Status"></span>
      <button type="button" class="w-more" aria-label="Open the ${esc(type.label)} store" data-more>${icon('dots')}</button>
    </div>
    <div class="w-body">${type.body(w)}</div>
    <div class="w-foot">${type.foot(w)}</div>
    <button type="button" class="w-grip" data-grip tabindex="0" aria-label="Resize ${esc(type.label)} widget with the arrow keys">${icon('resize')}</button>
    <span class="size-badge" aria-hidden="true">${Math.min(w.w, cols())}×${w.h}</span>`;

  el.querySelector('[data-more]').addEventListener('click', (e) => {
    e.stopPropagation();
    openStore(w.id, e.currentTarget);
  });
  const grip = el.querySelector('[data-grip]');
  grip.addEventListener('pointerdown', (e) => startResize(e, el));
  grip.addEventListener('keydown', (e) => keyResize(e, el));

  if (!editMode) el.addEventListener('pointerdown', (e) => startLongPress(e, el));
  el.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') {
      if (e.target.closest('[data-grip],[data-more]')) return;
      e.preventDefault();
      openStore(w.id, el);
    }
  });
  if (editMode) el.addEventListener('pointerdown', (e) => startDrag(e, el));
  return el;
}

function render() {
  grid.style.setProperty('--cols', cols());
  if (!state.length) {
    const empty = document.createElement('div');
    empty.className = 'empty-state';
    empty.innerHTML = `
      <span class="empty-mark">${icon('plus')}</span>
      <p class="empty-title">No widgets yet</p>
      <p class="empty-desc">Every screen from the app is available in the store. Put back the ones you want on your home.</p>
      <button type="button" class="btn-pill" data-restore>${icon('plus')}Restore the default widgets</button>`;
    empty.querySelector('[data-restore]').addEventListener('click', () => {
      state = normalize(defaultLayout());
      save();
      render();
      toast('Default widgets restored');
    });
    grid.replaceChildren(empty);
    return;
  }
  grid.replaceChildren(...state.map(widgetNode));
}

function applySpans(el, w, h) {
  el.style.gridColumn = `span ${Math.min(w, cols())}`;
  el.style.gridRow = `span ${h}`;
  el.dataset.size = sizeClass(h);
  const badge = el.querySelector('.size-badge');
  if (badge) badge.textContent = `${Math.min(w, cols())}×${h}`;
}

/* ==========================================================================
   Long press → that widget's store
   ========================================================================== */
const LONG_PRESS = 460;
let lpTimer = 0, lpStart = null, lpEl = null, lpHint = 0;

function startLongPress(e, el) {
  if (e.button !== undefined && e.button !== 0) return;
  if (e.target.closest('button, input, a, [data-grip]')) return;
  if (editMode) return;
  lpStart = { x: e.clientX, y: e.clientY };
  lpEl = el;
  el.dataset.pressing = 'true';
  lpHint = window.setTimeout(() => el.classList.add('pressing-hard'), LONG_PRESS * 0.55);
  lpTimer = window.setTimeout(() => {
    el.classList.remove('pressing-hard');
    el.dataset.pressing = 'false';
    if (navigator.vibrate) { try { navigator.vibrate(12); } catch { /* iOS ignores */ } }
    openStore(el.dataset.id, el);
  }, LONG_PRESS);

  window.addEventListener('pointerup', stopLongPress, { once: true });
  window.addEventListener('pointercancel', stopLongPress, { once: true });
  window.addEventListener('pointermove', lpMove);
}

function lpMove(ev) {
  if (!lpStart) return;
  if (Math.hypot(ev.clientX - lpStart.x, ev.clientY - lpStart.y) > 8) stopLongPress();
}

function stopLongPress() {
  window.removeEventListener('pointermove', lpMove);
  if (lpTimer) { window.clearTimeout(lpTimer); lpTimer = 0; }
  if (lpHint) { window.clearTimeout(lpHint); lpHint = 0; }
  if (lpEl) {
    lpEl.dataset.pressing = 'false';
    lpEl.classList.remove('pressing-hard');
  }
  lpStart = null;
  lpEl = null;
}

/* ==========================================================================
   Resize
   ========================================================================== */
function gridMetrics() {
  const styles = getComputedStyle(grid);
  const rowH = parseFloat(styles.gridAutoRows) || 84;
  const gap = parseFloat(String(styles.gap || '12').split(' ')[0]) || GAP;
  const colW = (grid.clientWidth - gap * (cols() - 1)) / cols();
  return { rowH, gap, colW };
}

function startResize(e, el) {
  e.preventDefault();
  e.stopPropagation();
  const w = find(el.dataset.id);
  if (!w) return;
  const type = TYPES[w.type];
  const { rowH, gap, colW } = gridMetrics();
  const startX = e.clientX, startY = e.clientY, startW = w.w, startH = w.h;
  el.classList.add('resizing');

  const move = (ev) => {
    const nw = clamp(startW + Math.round((ev.clientX - startX) / (colW + gap)), type.min[0], Math.min(type.max[0], cols()));
    const nh = clamp(startH + Math.round((ev.clientY - startY) / (rowH + gap)), type.min[1], type.max[1]);
    w.w = nw; w.h = nh;
    applySpans(el, nw, nh);
  };
  const end = () => {
    el.classList.remove('resizing');
    window.removeEventListener('pointermove', move);
    window.removeEventListener('pointerup', end);
    window.removeEventListener('pointercancel', end);
    save();
    if (!reduceMotion.matches) el.animate?.([{ transform: 'scale(0.99)' }, { transform: 'scale(1)' }], { duration: 160, easing: 'ease-out' });
  };
  window.addEventListener('pointermove', move);
  window.addEventListener('pointerup', end, { once: true });
  window.addEventListener('pointercancel', end, { once: true });
}

function keyResize(e, el) {
  const w = find(el.dataset.id);
  if (!w) return;
  const type = TYPES[w.type];
  const step = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[e.key];
  if (!step) return;
  e.preventDefault();
  e.stopPropagation();
  w.w = clamp(w.w + step[0], type.min[0], Math.min(type.max[0], cols()));
  w.h = clamp(w.h + step[1], type.min[1], type.max[1]);
  applySpans(el, w.w, w.h);
  save();
  toast(`${type.label} · ${w.w} × ${w.h}`);
}

/* ==========================================================================
   Edit mode + drag to reorder
   ========================================================================== */
const editBtn = $('#editBtn');
const editLabel = $('#editLabel');
const editbar = $('#editbar');

function setEdit(on) {
  editMode = on;
  document.body.dataset.edit = String(on);
  editBtn.setAttribute('aria-pressed', String(on));
  editLabel.textContent = on ? 'Done' : 'Edit';
  render();
  if (on) toast('Drag a widget to move it, drag its corner to resize.');
}

editBtn.addEventListener('click', () => setEdit(!editMode));
$('#doneBtn').addEventListener('click', () => setEdit(false));
$('#resetBtn').addEventListener('click', () => {
  state = normalize(defaultLayout());
  save();
  render();
  toast('Layout reset to the original widgets.');
});

function startDrag(e, el) {
  if (e.button !== undefined && e.button !== 0) return;
  if (e.target.closest('[data-grip], button, input, a')) return;
  e.preventDefault();
  const startX = e.clientX, startY = e.clientY;
  let lifted = false;
  let lastTarget = null;

  const move = (ev) => {
    const dx = ev.clientX - startX, dy = ev.clientY - startY;
    if (!lifted && Math.hypot(dx, dy) < 6) return;
    if (!lifted) {
      lifted = true;
      el.classList.add('dragging');
    }
    el.style.transform = `translate(${dx}px, ${dy}px) scale(1.02)`;
    const others = [...grid.children].filter((node) => node !== el);
    const target = others.find((node) => {
      const r = node.getBoundingClientRect();
      return ev.clientX >= r.left && ev.clientX <= r.right && ev.clientY >= r.top && ev.clientY <= r.bottom;
    });
    if (target && target !== lastTarget) {
      lastTarget = target;
      const r = target.getBoundingClientRect();
      const after = ev.clientY > r.top + r.height / 2;
      grid.insertBefore(el, after ? target.nextSibling : target);
    }
  };
  const end = () => {
    window.removeEventListener('pointermove', move);
    window.removeEventListener('pointerup', end);
    window.removeEventListener('pointercancel', end);
    el.classList.remove('dragging');
    el.style.transform = '';
    if (lifted) {
      state = [...grid.children].map((node) => find(node.dataset.id)).filter(Boolean);
      save();
    }
  };
  window.addEventListener('pointermove', move);
  window.addEventListener('pointerup', end, { once: true });
  window.addEventListener('pointercancel', end, { once: true });
}

/* ==========================================================================
   Store panel
   ========================================================================== */
const panel = $('#panel');
const scrim = $('#scrim');
const panelContent = $('#panelContent');
let panelWidgetId = null;

function openStore(id, opener) {
  const w = find(id);
  if (!w) return;
  panelWidgetId = id;
  openedFrom = opener || null;
  stopLongPress();
  renderPanel();

  scrim.hidden = false;
  requestAnimationFrame(() => {
    scrim.dataset.open = 'true';
    panel.dataset.open = 'true';
    panel.setAttribute('aria-hidden', 'false');
    document.body.dataset.panel = 'true';
  });
  window.setTimeout(() => panel.querySelector('[data-close]')?.focus(), 60);
}

function closePanel() {
  scrim.dataset.open = 'false';
  panel.dataset.open = 'false';
  panel.setAttribute('aria-hidden', 'true');
  document.body.removeAttribute('data-panel');
  panelWidgetId = null;
  window.setTimeout(() => {
    if (panel.dataset.open !== 'true') { scrim.hidden = true; panelContent.replaceChildren(); }
  }, 340);
  if (openedFrom && typeof openedFrom.focus === 'function') openedFrom.focus();
  openedFrom = null;
}

function sizeButtons(w) {
  const type = TYPES[w.type];
  return type.sizes.map(([bw, bh], i) => {
    const active = w.w === Math.min(bw, cols()) && w.h === bh;
    return `<button type="button" data-size="${i}" aria-pressed="${active}">${icon(['s', 'm', 'l'][i], 'ico-sm')}${['S', 'M', 'L'][i]}<span class="sr-only">${bw} × ${bh}</span></button>`;
  }).join('');
}

function renderPanel() {
  const w = find(panelWidgetId);
  if (!w) return;
  const type = TYPES[w.type];
  const others = ORDER.filter((t) => t !== w.type);
  panel.style.setProperty('--tint-src', `var(--${type.tint})`);

  panelContent.innerHTML = `

      <div class="panel-headtext">
        <h2 class="panel-title" id="panelTitle">Store</h2>
        <p class="panel-sub">${esc(type.label)} · ${esc(type.sub)}</p>
      </div>
      <button type="button" class="icon-btn" data-close aria-label="Close store">${icon('close')}</button>
    </div>

    <div class="panel-scroll">
      <section class="section">
        <p class="section-label">This widget <span class="mono" data-sizelabel>${Math.min(w.w, cols())} × ${w.h}</span></p>
        <div class="card">
          <div class="seg" role="group" aria-label="Widget size">${sizeButtons(w)}</div>
          <div class="panel-actions">
            <button type="button" class="btn-wide" data-act="expand">${icon('expand')}Open mini UI</button>
            <button type="button" class="btn-wide" data-act="duplicate">${icon('copy')}Duplicate</button>
          </div>
        </div>

      <section class="section">

const slotOf = (type) => Object.keys(SLOT_TYPES).find((slot) => SLOT_TYPES[slot].includes(type)) || null;
const modeLabel = () => (data.mode === 'live' ? 'Live' : data.mode === 'error' ? 'Not connected' : 'Demo');

/* one delegated handler for every native action */
panel.addEventListener('click', async (e) => {
  const w = find(panelWidgetId);
  if (!w) return;
  const type = TYPES[w.type];

  if (e.target.closest('[data-close]')) { closePanel(); return; }

  const sizeBtn = e.target.closest('[data-size]');
  if (sizeBtn) {
    const [bw, bh] = type.sizes[Number(sizeBtn.dataset.size)];
    w.w = clamp(bw, type.min[0], Math.min(type.max[0], cols()));
    w.h = clamp(bh, type.min[1], type.max[1]);
    save();
    patchWidget(w);
    renderPanel();
    toast(`${type.label} resized to ${w.w} × ${w.h}`);
    return;
  }

  const optBtn = e.target.closest('[data-opt]');
  if (optBtn) {
    const key = optBtn.dataset.opt;
    w.opts[key] = !w.opts[key];
    optBtn.setAttribute('aria-checked', String(!!w.opts[key]));
    save();
    patchWidget(w);
    return;
  }

  const act = e.target.closest('[data-act]')?.dataset.act;
  if (act === 'expand') {
    w.w = Math.min(type.max[0], cols());
    w.h = type.max[1];
    save(); patchWidget(w); renderPanel();
    toast(`${type.label} expanded to ${w.w} × ${w.h}`);
  } else if (act === 'duplicate') {
    const copy = { ...w, id: uid(), opts: { ...w.opts } };
    state.splice(state.findIndex((x) => x.id === w.id) + 1, 0, copy);
    save(); render(); renderPanel();
    toast(`${type.label} duplicated`);
  } else if (act === 'remove') {
    state = state.filter((x) => x.id !== w.id);
    save(); render(); closePanel();
    toast(`${type.label} removed`);
  } else if (act === 'reset') {
    state = normalize(defaultLayout());
    save(); render(); closePanel();
    toast('Layout reset to the original widgets.');
  }

  const addBtn = e.target.closest('[data-add]');
  if (addBtn && !addBtn.disabled) {
    const t = addBtn.dataset.add;
    state.push({ id: uid(), type: t, w: clamp(TYPES[t].sizes[0][0], TYPES[t].min[0], cols()), h: TYPES[t].sizes[0][1], opts: { ...TYPES[t].defaultOpts } });
    save(); render(); renderPanel();
    toast(`${TYPES[t].label} added`);
  }

  const nk = e.target.closest('[data-nk]');
  if (nk) await runAction(nk, w);
});

/* ==========================================================================
   Native actions — the only place this page changes engine state
   ========================================================================== */
async function runAction(el, w) {
  if (data.mode !== 'live') { toast('The engine is not reachable from this preview.', 'error'); return; }
  const action = el.dataset.nk;
  const id = el.dataset.id || '';
  el.disabled = true;
  try {
    if (action === 'refresh') {
      const slot = el.dataset.slot;
      await read(slot);
      renderPanel();
      toast('Refreshed from the engine.');
      return;
    }
    if (action === 'toggle-job') {
      const wanted = el.getAttribute('aria-checked') !== 'true';
      await Native.updateJob(id, { enabled: wanted });
      toast(wanted ? 'Job enabled.' : 'Job disabled.');
      await read('jobs');
      renderPanel();
      return;
    }
    if (action === 'run-due') {
      const result = await Native.handleWake('home_widget');
      toast(`Wake: ${result?.ran ?? 0} ran · ${result?.failed ?? 0} failed${result?.surfaced ? ` · ${result.surfaced} surfaced` : ''}`);
      await read('jobs', 'inbox');
      renderPanel();
      return;
    }
    if (action === 'resume-session') {
      if (!id) { toast('No session to resume.', 'error'); return; }
      await Native.resumeSession(id);
      toast('That session is now the engine’s active one.');
      return;
    }
    if (action === 'start-skill') {
      const result = await Native.startSkill(id);
      toast(result?.sessionKey ? `Skill started in its own session.` : 'Skill started.');
      await read('sessions');
      renderPanel();
      return;
    }
    if (action === 'memory-search') {
      const query = ($('#memQuery')?.value || '').trim();
      if (!query) { toast('Type something to search.', 'error'); return; }
      const result = Native.memorySearch(query);
      const parsed = await result;
      const results = Array.isArray(parsed) ? parsed : (parsed?.results ?? []);
      data.memorySearch = results.slice(0, 5);
      renderPanel();
      toast(results.length ? `${results.length} note(s) matched.` : 'No stored note matched.');
      return;
    }
    if (action === 'wake-on') {
      const raw = Number($('#wakeMinutes')?.value);
      const minutes = Number.isFinite(raw) ? Math.max(WAKE_FLOOR_MIN, Math.round(raw)) : 30;
      const result = await Native.scheduleWakes(minutes);
      if (result?.jobScheduled === false) toast(`Not scheduled: ${clip(result.reason || 'the OS refused', 90)}`, 'error');
      else toast(`Scheduled every ${result?.intervalMinutes ?? minutes} min.`);
      await read('wake');
      renderPanel();
      return;
    }
    if (action === 'wake-off') {
      const result = await Native.cancelWakes();
      toast(result?.jobCancelled === false ? 'The scheduler reported nothing to cancel.' : 'Background wakes turned off.');
      await read('wake');
      renderPanel();
      return;
    }
    if (action === 'clear-surfaced') {
      const result = await Native.clearSurfaced();
      toast(`${result?.cleared ?? 0} record(s) cleared.`);
      await read('inbox');
      renderPanel();
      return;
    }
    if (action === 'clear-events') {
      data.events = [];
      repaintType('logs');
      renderPanel();
      toast('Activity list cleared (this page only).');
      return;
    }
  } catch (error) {
    toast(errText(error), 'error');
  } finally {
    if (el.isConnected) el.disabled = false;
  }
}

panel.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { e.preventDefault(); closePanel(); return; }
  if (e.key !== 'Tab') return;
  const focusables = $$('button:not([disabled]), input, [tabindex]:not([tabindex="-1"])', panel)
    .filter((el) => el.offsetParent !== null || el === document.activeElement);
  if (!focusables.length) return;
  const first = focusables[0], last = focusables[focusables.length - 1];
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
});

panel.addEventListener('input', (e) => {
  if (e.target.id !== 'storeSearch') return;
  const q = e.target.value.trim().toLowerCase();
  $$('[data-row]', panel).forEach((row) => { row.hidden = !!q && !row.dataset.search.includes(q); });
});

scrim.addEventListener('click', closePanel);

function patchWidget(w) {
  const el = grid.querySelector(`.widget[data-id="${w.id}"]`);
  if (!el) return;
  const type = TYPES[w.type];
  applySpans(el, w.w, w.h);
  el.querySelector('.w-body').innerHTML = type.body(w);
  el.querySelector('.w-foot').innerHTML = type.foot(w);
  const label = panel.querySelector('[data-sizelabel]');
  if (label) label.textContent = `${Math.min(w.w, cols())} × ${w.h}`;
}

/* ==========================================================================
   Toast
   ========================================================================== */
const toaster = $('#toaster');
function toast(message, tone = 'ok') {
  const el = document.createElement('div');
  el.className = 'toast';
  el.dataset.tone = tone;
  el.innerHTML = `${icon(tone === 'error' ? 'info' : 'check')}<span>${esc(message)}</span>`;
  toaster.append(el);
  while (toaster.children.length > 2) toaster.firstElementChild.remove();
  window.setTimeout(() => {
    el.style.transition = 'opacity 220ms, transform 220ms';
    el.style.opacity = '0';
    el.style.transform = 'translateY(.35rem)';
    window.setTimeout(() => el.remove(), 240);
  }, reduceMotion.matches ? 1400 : 2200);
}

const glanceState = (() => {
  const fallback = { style: 0, place: null, weather: null };
  try {
    const raw = JSON.parse(localStorage.getItem(GLANCE_KEY) || 'null');
    return { ...fallback, ...(raw && typeof raw === 'object' ? raw : {}) };
  } catch { return { ...fallback }; }
})();
function saveGlance() {
  try { localStorage.setItem(GLANCE_KEY, JSON.stringify({ style: glanceState.style, place: glanceState.place, weather: glanceState.weather })); } catch { /* private */ }
}

const STYLE_NAMES = ['Analog', 'Digital', 'Minimal'];
const track = $('#glanceTrack');

function glanceNow() {
  const d = new Date();
  return {
    d,
    hh: String(d.getHours()).padStart(2, '0'),
    mm: String(d.getMinutes()).padStart(2, '0'),
    date: d.toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short' }),
  };
}

function watchBody() {
  const { d, hh, mm, date } = glanceNow();
  const style = STYLE_NAMES[glanceState.style] || 'Analog';
  if (style === 'Analog') {
    const minute = d.getMinutes(), hour = d.getHours() % 12 + minute / 60, second = d.getSeconds();
    const ticks = Array.from({ length: 12 }, (_, i) => {
      const a = (i * 30 * Math.PI) / 180;
      const r1 = i % 3 === 0 ? 17.5 : 19.5;
      const x1 = 32 + Math.sin(a) * r1, y1 = 32 - Math.cos(a) * r1;
      const x2 = 32 + Math.sin(a) * 22, y2 = 32 - Math.cos(a) * 22;
      return `<line class="${i % 3 === 0 ? 'tick tick-major' : 'tick'}" x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}"/>`;
    }).join('');
    const hand = (deg, len, cls) => {
      const a = (deg * Math.PI) / 180;
      return `<line class="hand ${cls}" x1="32" y1="32" x2="${(32 + Math.sin(a) * len).toFixed(1)}" y2="${(32 - Math.cos(a) * len).toFixed(1)}"/>`;
    };
    return `<div style="display:flex;align-items:center;gap:.5rem">
      <svg class="g-dial" viewBox="0 0 64 64" aria-hidden="true">
        <circle class="face" cx="32" cy="32" r="26"/>
        ${ticks}${hand(hour * 30, 12.5, 'hand-h')}${hand(minute * 6, 19, 'hand-m')}${hand(second * 6, 20.5, 'hand-s')}
        <circle class="cap" cx="32" cy="32" r="1.8"/>
      </svg>
      <div><div class="g-time">${hh}:${mm}</div><div class="g-sub">${esc(date)}</div></div>
    </div>`;
  }
  if (style === 'Digital') {
    return `<div><div class="g-time">${hh}<small>:</small>${mm}</div><div class="g-sub">${esc(date)}</div></div>`;
  }
  return `<div class="g-time" style="font-size:1.25rem">${hh}:${mm}</div>
    <div class="g-sub">${esc(date)}</div>`;
}

function weatherLabel(code) {
  return WMO[Number(code)] || ['—', 'cloud'];
}
function weatherBody() {
  const w = glanceState.weather;
  if (!w) {
    return `<div class="g-temp"><b>—</b><span>°C</span></div>

    <div class="g-sub" style="font-size:.625rem">${w.hi != null ? `H ${Math.round(w.hi)}° · L ${Math.round(w.lo)}°` : ''}</div>`;

function networkBody() {

function engineBody() {

/* ── weather: location + Open-Meteo, only ever after a tap ────────────────── */
async function loadWeather({ fromTap } = {}) {
  if (!Native.supported()) {
    if (fromTap) toast('Weather needs the app: window.NativeKit is not in this preview.', 'error');
    return;
  }
  try {
    if (!glanceState.place) {
      await Native.requestLocation();
      const position = await Native.locationCurrent();
      const coords = position?.coords || position;
      const lat = Number(coords?.latitude), lon = Number(coords?.longitude);
      if (!Number.isFinite(lat) || !Number.isFinite(lon)) throw new Error('No coordinates came back from the location plugin.');
      glanceState.place = { lat: Number(lat.toFixed(3)), lon: Number(lon.toFixed(3)) };
      saveGlance();
    }
    const { lat, lon } = glanceState.place;
    const url = `${WEATHER_URL}?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code,relative_humidity_2m,wind_speed_10m`
      + '&daily=temperature_2m_max,temperature_2m_min&forecast_days=1&timezone=auto';
    const response = await Native.httpGet(url);
    if (response?.status !== 200) throw new Error(`Open-Meteo answered ${response?.status ?? 'no status'}.`);
    const payload = response.data && typeof response.data === 'object' ? response.data : parse(response.data, null);
    const current = payload?.current;
    if (!current) throw new Error('Open-Meteo returned no current block.');
    const place = String(payload.timezone || 'here').split('/').pop().replace(/_/g, ' ');
    glanceState.weather = {
      temp: Number(current.temperature_2m),
      code: Number(current.weather_code),
      hi: Number(payload.daily?.temperature_2m_max?.[0]),
      lo: Number(payload.daily?.temperature_2m_min?.[0]),
      place,
      source: 'Open-Meteo',
      at: now(),
    };
    saveGlance();
    delete data.weatherError;
  } catch (error) {
    data.weatherError = errText(error);
    if (fromTap) toast(`Weather: ${errText(error)}`, 'error');
  }
  updateGlanceCard('weather');
}

async function readHost() {
  if (!Native.supported()) return;
  try { data.net = await Native.networkStatus(); delete data.netError; }
  catch (error) { data.netError = errText(error); }
  try { data.app = await Native.appInfo(); }
  catch { /* app.info() is optional here */ }
  updateGlanceCard('network');
}

track?.addEventListener('click', async (e) => {
  const card = e.target.closest('[data-g]');
  if (!card) return;
  const id = card.dataset.g;
  if (id === 'watch') {
    glanceState.style = (glanceState.style + 1) % STYLE_NAMES.length;
    saveGlance();
    renderGlance();
    toast(`${STYLE_NAMES[glanceState.style]} face`);
    return;
  }
  if (id === 'weather') { await loadWeather({ fromTap: true }); return; }
  if (id === 'network') { await readHost(); toast(data.net ? `${data.net.connectionType || 'network'} · ${data.net.connected ? 'online' : 'offline'}` : 'Network status unavailable', data.net ? 'ok' : 'error'); return; }
  if (id === 'engine') {
    if (data.mode !== 'live') { toast('The engine is not reachable from this preview.', 'error'); return; }
    await read('jobs', 'wake', 'inbox');
    updateGlanceCard('engine');
    toast('Refreshed from the engine.');
  }
});

renderGlance();
/* ==========================================================================
   Chrome: clock, greeting, mode chip, footnote
   ========================================================================== */
const clockEl = $('#clock');
const dateEl = $('#clockDate');
const greetingEl = $('#greeting');
const chip = $('.demo-chip');
const footnote = $('#footnote');

function tickClock() {
  const d = new Date();
  clockEl.textContent = `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
  dateEl.textContent = d.toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short' });
  const h = d.getHours();
  greetingEl.textContent = h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : h < 22 ? 'Good evening' : 'Good night';
}
tickClock();
window.setInterval(() => {
  tickClock();
  tickGlance();
}, 20000);

/* The engine card follows the same data the widgets use. */
function refreshGlanceEngine() { updateGlanceCard('engine'); }

function paintChrome() {
  const label = modeLabel();
  chip.dataset.mode = data.mode;
  chip.innerHTML = `<i></i>${esc(label)}`;
  chip.title = data.mode === 'live'
    ? 'Live data from the app’s agent engine (NativeKit).'
    : data.mode === 'error'
      ? (data.detail || 'The agent engine is unavailable on this device.')
      : 'Sample data. NativeKit is not present in this preview.';
  footnote.textContent = data.mode === 'live'
    ? 'Every number here comes from the app’s agent engine. Long-press a widget (or press its ••• button) for its store, add-ons and live actions.'
    : 'Every widget is a preview with sample data — window.NativeKit is not present, so nothing here reaches the agent engine. Long-press a widget (or press its ••• button) to open that mini UI’s store panel.';
}

/* ==========================================================================
   Engine events → widgets
   ========================================================================== */
const KEEP_EVENTS = 40;

function summarise(type, payload) {
  if (!payload || typeof payload !== 'object') return '';
  switch (type) {
    case 'agent.completed': return payload.sessionKey ? `completed · ${payload.sessionKey}` : 'completed';
    case 'agent.error': return clip(payload.error || payload.message || 'error', 60);
    case 'cron.job.started': return clip(payload.name || payload.jobId || 'job started', 50);
    case 'cron.job.completed': return clip(`${payload.status || 'completed'}${payload.durationMs ? ' · ' + Math.round(payload.durationMs) + ' ms' : ''}`, 50);
    case 'cron.job.error': return clip(payload.error || 'job error', 60);
    case 'cron.notification': return clip(payload.title || payload.body || 'notification', 50);
    case 'wake.jobs_found': return `${payload.count ?? payload.jobs ?? 0} due`;
    case 'wake.no_jobs': return 'nothing due';
    case 'wake.skipped': return clip(payload.reason || 'skipped', 40);
    case 'heartbeat.completed': return 'heartbeat done';
    case 'provider.fallback': return `${payload.fromProvider || '?'} → ${payload.toProvider || '?'}`;
    case 'provider.selected': return `${payload.provider || ''} ${payload.model || ''}`.trim();
    case 'tool_use': return clip(payload.toolName || '', 40);
    case 'tool_result': return clip(payload.toolName || '', 40);
    case 'approval_request': return clip(payload.toolName || 'approval', 40);
    case 'max_turns_reached': return `${payload.turns ?? ''} turns`;
    default: return '';
  }
}

function handleEvent(event) {
  const type = event?.eventType ?? event?.type ?? '';
  if (!type) return;
  const payload = parse(event?.payloadJson ?? event?.payload, {}) || {};

  // Deltas are far too frequent for a list; they only bump the volume counter.
  const isDelta = type === 'text_delta' || type === 'assistant_delta' || type === 'thinking' || type === 'thinking_delta' || type === 'reasoning_delta' || type === 'provider.bridge.delta';
  data.eventCount.push({ at: now(), type });
  if (data.eventCount.length > 600) data.eventCount.splice(0, data.eventCount.length - 600);

  if (!isDelta) {
    data.events.unshift({ at: now(), type, summary: summarise(type, payload) });
    if (data.events.length > KEEP_EVENTS) data.events.length = KEEP_EVENTS;
    repaintType('logs');
    if (panelWidgetId && find(panelWidgetId)?.type === 'logs') renderPanel();
  }

  // Targeted refreshes, one per family, never a full reload.
  if (/^(cron\.|wake\.|heartbeat\.)/.test(type)) {
    void read('jobs', 'inbox');
    if (/^wake\./.test(type)) void read('wake');
  } else if (type === 'agent.completed' || type === 'agent.error' || type === 'agent.background_timeout' || type === 'agent.background_completed') {
    void read('sessions', 'inbox');
  } else if (type === 'skill.started' || type === 'max_turns_reached') {
    void read('sessions');
  }
}

/* ==========================================================================
   Boot
   ========================================================================== */
render();
paintChrome();

async function boot() {
  if (!Native.supported()) {
    data.mode = 'demo';
    paintChrome();
    renderGlance();
    return;
  }
  data.mode = 'live';
  paintChrome();

  let remove = null;
  try {
    const availability = await Native.checkAvailability();
    if (availability && availability.available === false) {
      data.mode = 'error';
      data.detail = `The engine could not load on this device (${availability.abi || 'unknown ABI'}): ${clip(availability.reason || 'no reason reported', 120)}`;
      paintChrome();
      render();
      return;
    }
    // getWakeStatus() reports engineInitialized, so an already-booted engine
    // (the chat screen) is reused instead of being re-initialized underneath it.
    try {
      const status = await Native.getWakeStatus();
      if (status && typeof status.engineInitialized === 'boolean') data.engineInitialized = status.engineInitialized;
    } catch { /* older builds */ }
    if (data.engineInitialized !== true) await Native.initialize();

    remove = await Native.onEvent(handleEvent);
    window.addEventListener('pagehide', () => { try { remove?.remove?.(); } catch { /* gone */ } });
  } catch (e) {
    data.mode = 'error';
    data.detail = errText(e);
    paintChrome();
    render();
    return;
  }

  data.ready = true;
  render();
  paintChrome();
  await readHost();
  if (!glanceState.weather && glanceState.place) void loadWeather();
  await read('sessions', 'jobs', 'skills', 'memory', 'files', 'router', 'mcp', 'wake', 'inbox');
  repaintType('logs');

  // Slow safety net: wakes and cron runs can happen with no WebView alive, so a
  // 90-second poll picks up what no event announced.
  window.setInterval(() => { if (document.visibilityState === 'visible') void read('jobs', 'wake'); }, 90_000);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && data.mode === 'live') void read('jobs', 'wake', 'inbox');
  });
}

boot();

window.addEventListener('resize', () => {
  grid.style.setProperty('--cols', cols());
  state.forEach((w) => {
    const el = grid.querySelector(`.widget[data-id="${w.id}"]`);
    if (el) applySpans(el, w.w, w.h);
  });
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && editMode) setEdit(false);
});

try {
  if (!localStorage.getItem(HINT_KEY)) {
    localStorage.setItem(HINT_KEY, '1');
    window.setTimeout(() => toast('Long-press a widget for its store'), 700);
  }
} catch { /* private mode */ }
})();
</script>
</body>
