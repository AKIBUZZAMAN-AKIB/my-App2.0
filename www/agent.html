        return acc;
      }, []).filter((s) => s.trim());
      if (!pieces.length) return;
      speakingId = id;
      events.emit('change');
      pieces.forEach((piece, i) => {
        const utterance = new window.SpeechSynthesisUtterance(piece);
        if (i === pieces.length - 1) utterance.onend = () => finish(id);
        utterance.onerror = (e) => {
          if (speakingId !== id) return;
          finish(id);
          if (e.error !== 'canceled' && e.error !== 'interrupted') toast("This couldn't be read aloud.", { type: 'error' });
        };
        synth.speak(utterance);
      });
    },
    stop() {
      if (speakingId === null) return;
      speakingId = null;
      try { synth.cancel(); } catch { /* ignore */ }
      events.emit('change');
    },
  };
})();

/* ---------- text: markdown with a smoothed reveal (assistant-ui: useSmooth) ---------- */
class TextView {
  constructor() {
    this.kind = 'text';
    this.el = h('div', { class: 'aui-md', 'data-status': 'complete' });
    this.target = '';
    this.shown = 0;
    this.running = false;
    this.streamed = false;
    this.frame = 0;
    this.last = 0;
    this.painted = null;
    this.tick = this.tick.bind(this);
  }

  update(d) {
    const text = d.part.text;
    if (!text.startsWith(this.target.slice(0, this.shown))) this.shown = text.length; // discontinuity: snap
    this.target = text;
    this.running = d.running;
    if (d.running) this.streamed = true;
    if (!this.streamed || env.reducedMotion()) {
      this.shown = text.length;
      this.paint();
      return;
    }
    if (this.shown >= text.length) { this.paint(); return; }
    if (!this.frame) {
      this.last = performance.now();
      this.frame = requestAnimationFrame(this.tick);
    }
  }

  /** Reveals the backlog over ~250ms, never slower than one character per 5ms. */
  tick(now) {
    this.frame = 0;
    const remaining = this.target.length - this.shown;
    if (remaining > 0) {
      const perChar = Math.min(5, 250 / remaining);
      const add = Math.min(remaining, Math.floor((now - this.last) / perChar));
      if (add > 0) {
        this.shown += add;
        this.last += add * perChar;
        this.paint();
      }
    }
    if (this.shown < this.target.length) this.frame = requestAnimationFrame(this.tick);
    else this.paint();
  }

  paint() {
    let n = Math.min(this.shown, this.target.length);
    const code = this.target.charCodeAt(n - 1);
    if (n < this.target.length && code >= 0xd800 && code <= 0xdbff) n++; // never split a surrogate pair
    const streaming = this.running || n < this.target.length;
    const key = `${n}:${streaming}:${this.target.length}`;
    if (key === this.painted) return;
    this.painted = key;
    Markdown.render(this.el, n === this.target.length ? this.target : this.target.slice(0, n), { streaming });
    this.el.dataset.status = streaming ? 'running' : 'complete';
  }

  destroy() { cancelAnimationFrame(this.frame); this.frame = 0; }
}

/* ---------- reasoning: collapsible, held open with a live preview while it streams ---------- */
class ReasoningView {
  constructor() {
    this.kind = 'reasoning';
    this.text = null;
    this.streaming = false;
    this.userOpen = null;
    this.pinned = true;
    this.el = h('div', { class: 'aui-reasoning-root', 'data-slot': 'reasoning-root' });
    this.label = h('span', { class: 'aui-reasoning-trigger-label' }, 'Reasoning');
    this.trigger = h('button', { type: 'button', class: 'aui-reasoning-trigger' }, icon('brain'), this.label, icon('chevron-down', 'chevron'));
    this.md = h('div', { class: 'aui-md' });
    this.scroller = h('div', { class: 'aui-reasoning-text', onscroll: () => this.onScroll() }, this.md);
    this.fadeTop = h('div', { class: 'aui-reasoning-fade', 'data-side': 'top' });
    this.fadeBottom = h('div', { class: 'aui-reasoning-fade', 'data-side': 'bottom' });
    this.content = h('div', { class: 'aui-reasoning-content' }, this.fadeTop, this.scroller, this.fadeBottom);
    this.panel = collapsible(this.el, this.trigger, this.content, { onToggle: (open) => { this.userOpen = open; this.syncFades(); } });
  }

  onScroll() {
    const s = this.scroller;
    this.pinned = s.scrollHeight - s.scrollTop - s.clientHeight <= 2;
    this.syncFades();
  }
  syncFades() {
    this.fadeTop.dataset.show = String(this.scroller.scrollTop > 1);
    this.fadeBottom.dataset.show = String(this.streaming && this.panel.open);
  }

  update(d) {
    const text = d.parts.map((p) => p.text).join('\n\n');
    const streaming = d.running;
    if (streaming !== this.streaming) {
      this.streaming = streaming;
      this.pinned = true;
      this.panel.set(this.userOpen ?? streaming);
      this.content.setAttribute('aria-busy', String(streaming));
    }
    if (text !== this.text || streaming !== this.renderedStreaming) {
      this.text = text;
      this.renderedStreaming = streaming;
      Markdown.render(this.md, text, { streaming });
      if (streaming && this.pinned) this.scroller.scrollTop = this.scroller.scrollHeight;
    }
    const started = Math.min(...d.parts.map((p) => p.timing?.startedAt ?? Infinity));
    const done = d.parts.every((p) => p.timing?.completedAt !== undefined);
    const seconds = done && Number.isFinite(started) ? Math.round((Math.max(...d.parts.map((p) => p.timing.completedAt)) - started) / 1000) : 0;
    const label = seconds ? `Reasoning (${seconds}s)` : 'Reasoning';
    if (this.label.textContent !== label) this.label.textContent = label;
    this.label.classList.toggle('shimmer', streaming);
    this.syncFades();
  }

  destroy() {}
}

/* ---------- ToolFallback: one collapsible row per tool call ---------- */
const TOOL_STATUS_ICON = { running: 'loader', complete: 'check', incomplete: 'circle-x', 'requires-action': 'circle-exclamation-point' };

class ToolFallbackView {
  constructor() {
    this.statusType = null;
    this.signature = null;
    this.el = h('div', { class: 'aui-tool-fallback-root', 'data-slot': 'tool-fallback-root' });
    this.iconSlot = h('span', { class: 'aui-icon-swap' });
    this.label = h('span', { class: 'aui-tool-fallback-trigger-label' });
    this.duration = h('span', { class: 'aui-tool-fallback-duration' });
    this.trigger = h('button', { type: 'button', class: 'aui-tool-fallback-trigger', 'data-slot': 'tool-fallback-trigger' },
      this.iconSlot, this.label, this.duration, icon('chevron-down', 'chevron'));
    this.body = h('div', { class: 'aui-tool-fallback-content-inner' });
    this.panel = collapsible(this.el, this.trigger, this.body);
  }

  update(part, status) {
    const cancelled = status.type === 'incomplete' && status.reason === 'cancelled';
    const key = `${status.type}:${cancelled}:${part.toolName}`;
    if (key !== this.statusType) {
      this.statusType = key;
      this.iconSlot.replaceChildren(icon(TOOL_STATUS_ICON[status.type] || 'check', status.type === 'running' ? 'spin-fast' : ''));
      const text = status.type === 'running' ? 'Running tool'
        : status.type === 'requires-action' ? 'Waiting on tool'
        : status.type === 'incomplete' ? (cancelled ? 'Cancelled tool' : 'Failed tool')
        : 'Used tool';
      this.label.replaceChildren(`${text}: `, h('b', null, part.toolName));
      this.label.classList.toggle('shimmer', status.type === 'running');
      this.trigger.dataset.cancelled = String(cancelled);
    }
    const timing = part.timing;
    const duration = timing?.completedAt !== undefined ? formatDuration(timing.completedAt - timing.startedAt) : '';
    if (this.duration.textContent !== duration) this.duration.textContent = duration;

    const signature = `${part.argsText}\u0000${part.result === undefined ? '' : formatUnknownValue(part.result)}\u0000${part.isError}`;
    if (signature === this.signature) return;
    this.signature = signature;
    const parsed = part.argsText ? tryParseJSON(part.argsText) : { ok: true, value: part.args ?? {} };
    const args = parsed.ok ? JSON.stringify(parsed.value, null, 2) : part.argsText;
    const children = [];
    if (part.isError && part.result && typeof part.result === 'object' && 'error' in part.result) {
      children.push(h('p', { class: 'aui-tool-fallback-error' }, h('b', null, 'Error: '), formatUnknownValue(part.result.error)));
    }
    if (args && args !== '{}') children.push(h('pre', { class: 'aui-tool-fallback-args-value', tabindex: '0', 'aria-label': 'Arguments' }, args));
    if (part.result !== undefined && !part.isError) {
      children.push(h('div', { class: 'aui-tool-fallback-result' },
        h('p', { class: 'aui-tool-fallback-result-header' }, 'Result:'),
        h('pre', { class: 'aui-tool-fallback-result-content', tabindex: '0', 'aria-label': 'Result' }, formatUnknownValue(part.result, 2))));
    }
    this.body.replaceChildren(...children);
  }
}

/** Adjacent tool calls without their own UI: a single row, or an "N tool calls" group when there are several. */
class ToolGroupView {
  constructor() {
    this.kind = 'tools';
    this.el = h('div', { class: 'aui-tool-calls', 'data-slot': 'aui_chain-of-thought' });
    this.rows = new Map();
    this.order = '';
    this.group = null;
    this.userOpen = null;
  }

  update(d) {
    const next = new Map();
    for (const { part, status } of d.parts) {
      const row = this.rows.get(part.toolCallId) || new ToolFallbackView();
      row.update(part, status);
      next.set(part.toolCallId, row);
    }
    this.rows = next;
    const order = [...next.keys()].join('\u0000');

    if (d.parts.length === 1) {
      const row = next.values().next().value;
      if (this.el.firstChild !== row.el || this.el.childNodes.length !== 1) this.el.replaceChildren(row.el);
      this.order = order;
      return;
    }

    if (!this.group) {
      const root = h('div', { class: 'aui-tool-group-root', 'data-slot': 'tool-group-root' });
      const loader = h('span', { class: 'aui-icon-swap' });
      const label = h('span', { class: 'aui-tool-group-trigger-label' });
      const trigger = h('button', { type: 'button', class: 'aui-tool-group-trigger' }, loader, label, icon('chevron-down', 'chevron'));
      const list = h('div', { class: 'aui-tool-group-content-inner' });
      const panel = collapsible(root, trigger, list, { onToggle: (open) => { this.userOpen = open; } });
      this.group = { root, loader, label, list, panel };
      this.order = '';
    }
    const { root, loader, label, list, panel } = this.group;
    const active = d.parts.some((p) => p.status.type === 'running');
    const needsAction = d.parts.some((p) => p.status.type === 'requires-action');
    const text = `${d.parts.length} tool calls`;
    if (label.textContent !== text) label.textContent = text;
    label.classList.toggle('shimmer', active);
    if (active !== !!loader.firstChild) loader.replaceChildren(...(active ? [icon('loader', 'spin-fast')] : []));
    loader.hidden = !active;
    panel.set(needsAction || (this.userOpen ?? false));
    if (order !== this.order) {
      list.replaceChildren(...[...next.values()].map((row) => row.el));
      this.order = order;
    }
    if (this.el.firstChild !== root || this.el.childNodes.length !== 1) this.el.replaceChildren(root);
  }

  destroy() {}
}

/** Port of approval-card.tsx: a request with Deny / Always allow / Allow once, then a receipt of what happened. */
function renderApprovalCard(part, status, respond) {
  const config = TOOLKIT[part.toolName]?.approval || {};
  const approval = part.approval;
  const state = !approval ? 'preparing'
    : approval.resolution ? 'closed'
    : approval.approved === undefined ? 'request'
    : approval.approved === false ? 'denied'
    : part.result === undefined ? (status.type === 'running' ? 'running' : 'closed')
    : part.isError ? 'failed' : 'done';
  const title = config.title || `Run ${part.toolName}`;
  const details = (config.details ? config.details(part.args || {}) : Object.entries(part.args || {}).map(([label, value]) => ({ label, value: formatUnknownValue(value) })))
    .filter((d) => d.value !== '');

  let actions;
  if (state === 'request') {
    actions = [
      h('button', { type: 'button', class: 'aui-pill aui-pill-ghost', 'data-slot': 'approval-card-deny', onclick: () => respond(false, 'deny') }, 'Deny'),
      h('button', { type: 'button', class: 'aui-pill aui-pill-ghost', 'data-slot': 'approval-card-always-allow', onclick: () => respond(true, 'allow-always') }, 'Always allow'),
      h('button', { type: 'button', class: 'aui-pill aui-pill-ink', 'data-slot': 'approval-card-allow-once', onclick: () => respond(true, 'allow-once') }, 'Allow once'),
    ];
  } else if (state !== 'preparing') {
    const receipt = {
      running: ['loader-circle', config.runningLabel || 'Approved, running', 'spin'],
      done: ['check', `${config.doneLabel || 'Finished'}${approval.isAutomatic ? ' · allowed automatically' : ''}`],
      denied: ['x', config.deniedLabel || 'Denied'],
      failed: ['circle-x', `Failed: ${formatUnknownValue(part.result?.error ?? part.result)}`],
      closed: ['circle-minus', approval.resolution === 'expired' ? 'Expired before a decision' : 'Cancelled before a decision'],
    }[state];
    actions = h('div', { class: 'aui-approval-card-receipt animate-in fade-in dur-300', role: 'status', tabindex: '-1', 'data-receipt': '', 'data-state': state },
      icon(receipt[0], receipt[2] || ''), receipt[1]);
  }

  return h('div', { class: 'aui-approval-card paper animate-in fade-in slide-up-1 dur-200', 'data-slot': 'approval-card', 'data-state': state, role: 'group', 'aria-label': title },
    h('div', { class: 'aui-approval-card-header' },
      h('span', { class: 'aui-approval-card-icon', 'aria-hidden': 'true' }, icon(config.icon || 'terminal')),
      h('div', null,
        h('p', { class: 'aui-approval-card-title' }, title),
        h('p', { class: 'aui-approval-card-subtitle' }, state === 'request' ? `${part.toolName} · needs your approval` : part.toolName))),
    details.length > 0 && h('dl', { class: 'aui-approval-card-details surface-field' },
      details.map((detail) => h('div', null, h('dt', { class: 'mono' }, detail.label), h('dd', null, detail.value)))),
    h('div', { class: 'aui-approval-card-actions' }, actions),
  );
}

/** A tool call that has its own component (approval card), like a toolkit `render` in assistant-ui. */
class ToolUIView {
  constructor(respond) {
    this.kind = 'tool-ui';
    this.respond = respond;
    this.signature = null;
    this.row = new ToolFallbackView();
    this.slot = h('div', { class: 'aui-tool-ui' });
    this.el = h('div', { class: 'aui-tool-call' }, this.row.el, this.slot);
  }

  update(d) {
    const { part, status } = d;
    const tool = TOOLKIT[part.toolName];
    const gated = !!part.approval || !!tool?.needsApproval;
    this.row.update(part, status);
    this.row.el.hidden = gated;
    const signature = JSON.stringify([part.argsText, part.result, part.isError, part.approval, status.type]);
    if (signature === this.signature) return;
    this.signature = signature;
    const ui = gated
      ? renderApprovalCard(part, status, (approved, optionId) => this.respond(part.approval.id, approved, optionId))
      : null;
    const hadFocus = this.slot.contains(doc.activeElement);
    this.slot.replaceChildren(...(ui ? [ui] : []));
    this.slot.hidden = !ui;
    if (hadFocus) this.slot.querySelector('[data-receipt]')?.focus({ preventScroll: true });
  }

  destroy() {}
}

class IndicatorView {
  constructor() {
    this.kind = 'indicator';
    this.el = h('p', { class: 'aui-assistant-message-indicator' }, h('span', { class: 'aui-indicator pulse', role: 'status', 'aria-label': 'Assistant is working' }, '●'));
  }

}

/* ---------- attachments ---------- */
const TEXT_FILE = /\.(txt|md|markdown|csv|tsv|json|jsonl|xml|html?|css|scss|js|mjs|cjs|jsx|ts|tsx|py|rb|go|rs|java|kt|swift|c|h|cc|cpp|hpp|cs|php|sh|bash|zsh|sql|ya?ml|toml|ini|env|log|tex|r|lua|dart|scala|vue|svelte|svg|diff|patch)$/i;

function readAsDataURL(blob) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(reader.error || new Error('The file could not be read.'));
    reader.readAsDataURL(blob);
  });
}

/** Large photos are scaled down before they are stored and sent; transparent areas become white. */
async function prepareImage(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((resolve, reject) => {
      const el = new Image();
      el.onload = () => resolve(el);
      el.onerror = () => reject(new Error(`${file.name} could not be read as an image.`));
      el.src = url;
    });
    const scale = Math.min(1, 1568 / Math.max(img.naturalWidth, img.naturalHeight));
    if (scale === 1 && file.size <= 500000) return await readAsDataURL(file);
    const canvas = h('canvas', { width: Math.max(1, Math.round(img.naturalWidth * scale)), height: Math.max(1, Math.round(img.naturalHeight * scale)) });
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    return canvas.toDataURL('image/jpeg', 0.85);
  } finally {
    URL.revokeObjectURL(url);
  }
}

async function fileToAttachment(file) {
  const name = file.name || 'pasted-file';
  const base = { id: uid(8), name, status: { type: 'complete' } };
  // The native agent takes a text prompt only, so files go in as text, like agent.html.
  if (file.type.startsWith('image/')) throw new Error(`${name} is an image. The agent in this app takes text files only.`);
  const textual = file.type.startsWith('text/') || /json|xml|javascript|typescript|yaml|x-sh|sql|csv/.test(file.type) || TEXT_FILE.test(name);
  if (!textual) throw new Error(`${name} can't be attached. Only text files are supported.`);
  if (file.size > 400000) throw new Error(`${name} is too large to attach as text (limit 400 KB).`);
  const text = await file.text();
  if (text.includes('\u0000')) throw new Error(`${name} doesn't look like a text file.`);
  return {
    ...base, type: 'document', contentType: file.type || 'text/plain',
    content: [{ type: 'text', text: `<attached-file name="${name.replace(/"/g, "'")}">\n${text}\n</attached-file>` }],
  };
}

/**
 * Pointer-driven reordering for a list, used by the attachment strip and the provider list.
 * One code path for mouse, pen and touch:
 *   - with `handle`, a press on the handle starts the drag at once (the handle has touch-action: none);
 *   - without it, a mouse or pen starts after a few pixels of movement, and a finger after a short
 *     press-and-hold, so a quick swipe still scrolls the strip.
 * Keyboard: arrow keys on a handle (or Alt + arrow keys on an item) move it one place.
 * `onReorder(from, to)` receives indexes into the items as they were before the drag.
 */
function makeSortable(list, { item, handle = null, ignore = null, axis = 'y', holdMs = 260, onReorder }) {
  const items = () => [...list.children].filter((el) => el.matches(item));
  const coord = (e) => (axis === 'y' ? e.clientY : e.clientX);
  let s = null;

  const reset = () => {
    if (!s) return;
    clearTimeout(s.timer);
    for (const el of s.others || []) { el.style.transform = ''; el.style.transition = ''; }
    if (s.el) { s.el.style.transform = ''; s.el.style.transition = ''; delete s.el.dataset.dragging; }
    delete list.dataset.sorting;
    try { if (s.captured) s.el.releasePointerCapture(s.pointerId); } catch { /* already released */ }
    s = null;
  };

  const activate = () => {
    const all = items();
    s.active = true;
    s.from = all.indexOf(s.el);
    s.to = s.from;
    s.rects = all.map((el) => el.getBoundingClientRect());
    const r = s.rects[s.from];
    const next = s.rects[s.from + 1] || s.rects[s.from - 1];
    const gap = next ? Math.abs(axis === 'y' ? (next.top - r.top) : (next.left - r.left)) - (axis === 'y' ? r.height : r.width) : 0;
    s.step = (axis === 'y' ? r.height : r.width) + Math.max(0, gap);
    s.all = all;
    s.others = all.filter((el) => el !== s.el);
    for (const el of s.others) el.style.transition = 'transform 180ms cubic-bezier(0.2, 0, 0, 1)';
    s.el.dataset.dragging = 'true';
    list.dataset.sorting = 'true';
    try { s.el.setPointerCapture(s.pointerId); s.captured = true; } catch { /* pointer already gone */ }
    if (s.touch) navigator.vibrate?.(8);
  };

  const move = (e) => {
    const delta = coord(e) - s.start;
    s.el.style.transform = axis === 'y' ? `translate3d(0, ${delta}px, 0)` : `translate3d(${delta}px, 0, 0)`;
    const r = s.rects[s.from];
    const center = (axis === 'y' ? r.top + r.height / 2 : r.left + r.width / 2) + delta;
    let to = s.from;
    s.rects.forEach((rect, i) => {
      if (i === s.from) return;
      const mid = axis === 'y' ? rect.top + rect.height / 2 : rect.left + rect.width / 2;
      if (i > s.from && center > mid) to = Math.max(to, i);
      if (i < s.from && center < mid) to = Math.min(to, i);
    });
    s.to = to;
    s.all.forEach((el, i) => {
      if (el === s.el) return;
      let shift = 0;
      if (s.from < to && i > s.from && i <= to) shift = -s.step;
      if (s.from > to && i < s.from && i >= to) shift = s.step;
      el.style.transform = shift ? (axis === 'y' ? `translate3d(0, ${shift}px, 0)` : `translate3d(${shift}px, 0, 0)`) : '';
    });
  };

  list.addEventListener('pointerdown', (e) => {
    if (s || (e.pointerType === 'mouse' && e.button !== 0)) return;
    const el = e.target.closest(item);
    if (!el || el.parentElement !== list || items().length < 2) return;
    if (ignore && e.target.closest(ignore)) return;
    const onHandle = handle ? !!e.target.closest(handle) : false;
    if (handle && !onHandle) return;
    s = { el, pointerId: e.pointerId, start: coord(e), startX: e.clientX, startY: e.clientY, touch: e.pointerType === 'touch', active: false };
    if (onHandle) { e.preventDefault(); activate(); }
    else if (s.touch) s.timer = setTimeout(() => { if (s && !s.active) activate(); }, holdMs);
  });
  list.addEventListener('pointermove', (e) => {
    if (!s || e.pointerId !== s.pointerId) return;
    if (!s.active) {
      const dist = Math.hypot(e.clientX - s.startX, e.clientY - s.startY);
      if (s.touch) { if (dist > 8) reset(); return; } // the finger is scrolling, not holding
      if (dist < 5) return;
      activate();
    }
    e.preventDefault();
    move(e);
  });
  const end = (e) => {
    if (!s || e.pointerId !== s.pointerId) return;
    const done = s.active && e.type === 'pointerup';
    const { from, to, active } = s;
    reset();
    if (active) {
      // The release would otherwise click the item (open a preview, open a provider).
      const swallow = (ev) => { ev.stopPropagation(); ev.preventDefault(); };
      list.addEventListener('click', swallow, { capture: true, once: true });
      setTimeout(() => list.removeEventListener('click', swallow, { capture: true }), 0);
    }
    if (done && from !== to) onReorder(from, to);
  };
  list.addEventListener('pointerup', end);
  list.addEventListener('pointercancel', end);
  // Once a drag is live, a finger must not scroll the page or open the long-press menu.
  list.addEventListener('touchmove', (e) => { if (s?.active && e.cancelable) e.preventDefault(); }, { passive: false });
  list.addEventListener('contextmenu', (e) => { if (s) e.preventDefault(); });
  list.addEventListener('dragstart', (e) => { if (e.target.closest(item)) e.preventDefault(); });

  list.addEventListener('keydown', (e) => {
    const keys = axis === 'y' ? { ArrowUp: -1, ArrowDown: 1 } : { ArrowLeft: -1, ArrowRight: 1 };
    let dir = keys[e.key];
    if (!dir) return;
    const onHandle = handle && e.target.closest(handle);
    if (!onHandle && !(e.altKey && !handle)) return;
    const el = e.target.closest(item);
    if (!el) return;
    if (axis === 'x' && getComputedStyle(list).direction === 'rtl') dir = -dir;
    const all = items();
    const from = all.indexOf(el);
    const to = from + dir;
    if (to < 0 || to >= all.length) return;
    e.preventDefault();
    onReorder(from, to, { keyboard: true });
  });
  return { cancel: reset };
}

/** Returns a copy of `array` with the item at `from` moved to `to`. */
const moveItem = (array, from, to) => {
  const copy = [...array];
  const [moved] = copy.splice(from, 1);
  copy.splice(to, 0, moved);
  return copy;
};

function attachmentTile(attachment, { onRemove, onPreview } = {}) {
  const src = attachment.type === 'image' ? attachment.content?.[0]?.image : null;
  const ext = attachment.name.includes('.') ? attachment.name.split('.').pop().slice(0, 4) : '';
  const tile = src
    ? h('button', { type: 'button', class: 'aui-attachment-tile', 'aria-label': `Preview ${attachment.name}`, 'data-tooltip': attachment.name, 'data-tooltip-side': 'top', onclick: () => onPreview?.(src, attachment.name) }, h('img', { src, alt: '', draggable: 'false' }))
    : h('div', { class: 'aui-attachment-tile', role: 'img', tabindex: onRemove ? '0' : null, 'aria-label': `File ${attachment.name}`, 'data-tooltip': attachment.name, 'data-tooltip-side': 'top' }, icon('file-text'), ext && h('span', { class: 'aui-attachment-tile-ext' }, ext));
  return h('div', { class: `aui-attachment-root${onRemove ? ' animate-in fade-in zoom-in-95 dur-200' : ''}`, 'data-id': attachment.id }, tile,
    onRemove && h('button', { type: 'button', class: 'aui-attachment-tile-remove', 'aria-label': `Remove ${attachment.name}`, onclick: onRemove }, icon('x')));
}

/* ---------- assistant message ---------- */
class AssistantMessageView {
  constructor(thread, message) {
    this.thread = thread;
    this.id = message.id;
    this.role = 'assistant';
    this.nodes = new Map();
    this.parts = h('div', { class: 'aui-assistant-message-parts' });
    this.extra = h('div', { class: 'aui-assistant-message-extra' });
    this.footer = h('div', { class: 'aui-assistant-message-footer', 'data-slot': 'aui_assistant-message-footer' });
    this.el = h('div', { class: 'aui-message aui-assistant-message-root animate-in fade-in slide-up-1', 'data-slot': 'aui_assistant-message-root', 'data-role': 'assistant', 'data-message-id': message.id },
      h('div', { class: 'aui-assistant-message-content', 'data-slot': 'aui_assistant-message-content', dir: 'auto' }, this.parts, this.extra),
      this.footer);
    this.footerKey = null;
    this.copied = false;
  }

  /** Groups parts the way the Thread element does: reasoning runs, tool-call runs, standalone tool UIs, text. */
  describe(message) {
    const nodes = [];
    const content = message.content;
    const running = message.status.type === 'running';
    const standalone = (p) => !!p.approval || !!TOOLKIT[p.toolName]?.ui || !!TOOLKIT[p.toolName]?.needsApproval;
    let i = 0;
    while (i < content.length) {
      const part = content[i];
      if (part.type === 'reasoning') {
        const start = i;
        const parts = [];
        while (i < content.length && content[i].type === 'reasoning') parts.push(content[i++]);
        nodes.push({ kind: 'reasoning', key: `r${start}`, parts, running: running && i === content.length });
      } else if (part.type === 'tool-call') {
        if (standalone(part)) {
          nodes.push({ kind: 'tool-ui', key: `t${part.toolCallId}`, part, status: partStatus(message, i) });
          i++;
        } else {
          const parts = [];
          while (i < content.length && content[i].type === 'tool-call' && !standalone(content[i])) {
            parts.push({ part: content[i], status: partStatus(message, i) });
            i++;
          }
          nodes.push({ kind: 'tools', key: `g${parts[0].part.toolCallId}`, parts });
        }
      } else if (part.type === 'text') {
        const last = i === content.length - 1;
        if (part.text.trim() || (running && last)) nodes.push({ kind: 'text', key: `x${i}`, part, running: running && last });
        i++;
      } else i++;
    }
    const lastPart = content[content.length - 1];
    if (running && (!lastPart || (lastPart.type === 'tool-call' && lastPart.result !== undefined))) nodes.push({ kind: 'indicator', key: 'indicator' });
    return nodes;
  }

  createNode(kind) {
    switch (kind) {
      case 'text': return new TextView();
      case 'reasoning': return new ReasoningView();
      case 'tools': return new ToolGroupView();
      case 'tool-ui': return new ToolUIView((approvalId, approved, optionId) => this.thread.runtime.respondToToolApproval({ approvalId, approved, optionId }));
      default: return new IndicatorView();
    }
  }

  update(message, ctx) {
    if (message !== this.message) {
      this.message = message;
      const next = new Map();
      let cursor = this.parts.firstChild;
      for (const d of this.describe(message)) {
        let view = this.nodes.get(d.key);
        if (!view || view.kind !== d.kind) view = this.createNode(d.kind);
        view.update(d);
        next.set(d.key, view);
        if (view.el === cursor) cursor = cursor.nextSibling;
        else this.parts.insertBefore(view.el, cursor);
      }
      for (const [key, view] of this.nodes) {
        if (next.get(key) !== view) { view.destroy(); view.el.remove(); }
      }
      this.nodes = next;
      this.renderExtra(message);
    }
    this.renderFooter(message, ctx);
  }

  renderExtra(message) {
    const status = message.status;
    const key = `${status.type}:${status.reason || ''}:${status.error || ''}:${message.content.length}`;
    if (key === this.extraKey) return;
    this.extraKey = key;
    const children = [];
    if (status.type === 'incomplete') {
      if (status.reason === 'error') {
        children.push(h('div', { class: 'aui-message-error-root', role: 'alert' },
          icon('circle-exclamation-point'),
          h('span', { class: 'aui-message-error-message' }, formatUnknownValue(status.error) || 'Something went wrong.')));
      } else {
        const note = status.reason === 'length' ? 'The reply was cut off at the output limit.'
          : status.reason === 'content-filter' ? "The provider's content filter stopped this reply."
          : status.reason === 'cancelled' && !message.content.some((p) => p.type !== 'text' || p.text.trim()) ? 'Stopped before anything was written.'
          : '';
        if (note) children.push(h('p', { class: 'aui-message-note' }, icon('info'), note));
      }
    }
    this.extra.replaceChildren(...children);
  }

  renderFooter(message, ctx) {
    const settled = message.status.type === 'complete' || message.status.type === 'incomplete';
    const showBar = !ctx.running && settled;
    const speaking = Speech.speakingId === message.id;
    const key = [showBar, ctx.isLast, ctx.running, this.copied, speaking].join('|');
    if (key === this.footerKey) return;
    this.footerKey = key;

    let bar = null;
    if (showBar) {
      const copyIcon = swapIcon('copy', 'check');
      if (this.copied) copyIcon.swap(true);
      const copy = iconButton('Copy', copyIcon, async () => {
        if (this.copied) return;
        if (!(await copyText(messageText(this.message)))) { toast("Couldn't copy to the clipboard.", { type: 'error' }); return; }
        this.copied = true;
        this.thread.schedule.schedule();
        clearTimeout(this.copyTimer);
        this.copyTimer = setTimeout(() => { this.copied = false; this.thread.schedule.schedule(); }, 3000);
      });
      const more = iconButton('More', icon('ellipsis'), () => {
        openMenu(more, [
          Speech.available && (Speech.speakingId === this.message.id
            ? { label: 'Stop reading', icon: 'square', onSelect: () => Speech.stop() }
            : { label: 'Read aloud', icon: 'volume-2', onSelect: () => Speech.speak(this.message.id, Markdown.toPlainText(messageText(this.message))) }),
          { label: 'Export as Markdown', icon: 'download', onSelect: () => this.thread.app.exportMarkdown(messageText(this.message)) },
        ], { side: 'bottom', align: 'start', label: 'More actions' });
      }, { 'aria-haspopup': 'menu', 'aria-expanded': 'false' });
      bar = h('div', { class: 'aui-action-bar aui-assistant-action-bar-root', 'data-autohide': String(!ctx.isLast) }, copy, more);
    }
    const hadFocus = this.footer.contains(doc.activeElement) ? doc.activeElement.getAttribute('aria-label') : null;
    this.footer.replaceChildren(...[bar].filter(Boolean));
    if (hadFocus) this.footer.querySelector(`[aria-label="${CSS.escape(hadFocus)}"]`)?.focus({ preventScroll: true });
  }

  destroy() {
    clearTimeout(this.copyTimer);
    for (const view of this.nodes.values()) view.destroy();
  }
}

class Composer {
  constructor(thread) {
    this.thread = thread;
    this.app = thread.app;
    this.runtime = null;
    this.attachments = [];
    this.drafts = new Map();
    this.dictation = null;
    this.busy = 0;
    this.dragDepth = 0;

    this.fileInput = h('input', {
      type: 'file', multiple: true, hidden: true, tabindex: '-1', 'aria-hidden': 'true',
      accept: 'text/*,.md,.csv,.json,.xml,.yaml,.yml,.toml,.log,.js,.ts,.tsx,.jsx,.py,.rb,.go,.rs,.java,.c,.cpp,.h,.cs,.php,.sh,.sql,.html,.css',

      },
    });
    this.dropOverlay = h('div', { class: 'drop-overlay', hidden: true, 'aria-hidden': 'true' },

        h('p', { class: 'drop-overlay-hint' }, 'Images up to 20 MB, text and code files up to 400 KB')));
    this.bindFileDrop();
    this.input = h('textarea', {
      class: 'aui-composer-input', rows: '1', placeholder: 'Send a message...', 'aria-label': 'Message input',
      enterkeyhint: 'send', dir: 'auto', autocomplete: 'off',
      oninput: () => { this.autosize(); this.sync(); this.thread.syncSuggestions(); },
      onkeydown: (e) => this.onKeyDown(e),
      onpaste: (e) => {
        const files = [...(e.clipboardData?.files || [])];
        if (files.length) { e.preventDefault(); this.addFiles(files); }
      },
    });
    this.addButton = h('button', {
      type: 'button', class: 'aui-composer-round aui-composer-add-attachment', 'data-tooltip': 'Add attachment', 'aria-label': 'Add attachment',
      onclick: () => this.fileInput.click(),
    }, icon('plus'));
    this.modelLabel = h('span', { class: 'truncate' });
    this.modelButton = h('button', {
      type: 'button', class: 'aui-model-selector-trigger', 'data-slot': 'model-selector-trigger', 'aria-haspopup': 'dialog', 'aria-expanded': 'false',
      onclick: () => this.app.openModelPicker(this.modelButton),
    }, this.modelLabel, icon('chevron-down'));
    this.dictate = h('button', {
      type: 'button', class: 'aui-composer-round aui-composer-dictate', 'data-tooltip': 'Voice input', 'aria-label': 'Start voice input',
      onclick: () => this.startDictation(),
    }, icon('mic'));
    this.stopDictate = h('button', {
      type: 'button', class: 'aui-composer-round aui-composer-stop-dictation', 'data-tooltip': 'Stop dictation', 'aria-label': 'Stop voice input',
      onclick: () => this.stopDictation(),
    }, icon('square', 'pulse'));
    this.sendButton = h('button', {
      type: 'button', class: 'aui-composer-round aui-composer-send', 'data-tooltip': 'Send message', 'aria-label': 'Send message',
      onclick: () => this.send(),
    }, icon('arrow-up'));
    this.cancelButton = h('button', {
      type: 'button', class: 'aui-composer-round aui-composer-cancel', 'data-tooltip': 'Stop generating', 'aria-label': 'Stop generating',
      onclick: () => this.runtime.cancelRun(),
    }, icon('square'));

    this.shell = h('div', {
      class: 'aui-composer-shell', 'data-slot': 'aui_composer-shell', 'data-dragging': 'false',
      onclick: (e) => { if (!e.target.closest('button, textarea, input, .aui-composer-attachments')) this.input.focus(); },
    },
      this.attachmentRow,
      this.input,
      h('div', { class: 'aui-composer-action-wrapper' },
        h('div', { class: 'aui-composer-action-start' }, this.addButton, this.modelButton),
        h('div', { class: 'aui-composer-action-end' }, this.dictate, this.stopDictate, this.sendButton, this.cancelButton)),

  }

  get isEmpty() { return !this.input.value.trim() && this.attachments.length === 0; }

  /** Files dragged from the desktop can be dropped anywhere on the page, not only on the composer. */
  bindFileDrop() {
    const setDragging = (on) => {
      this.dropOverlay.hidden = !on;
      if (this.shell) this.shell.dataset.dragging = String(on);
    };
    const blocked = () => !!doc.querySelector('.dialog-overlay');
    window.addEventListener('dragenter', (e) => {
      if (!hasFiles(e) || blocked()) return;
      e.preventDefault();
      if (!this.dropOverlay.isConnected) (doc.getElementById('portal') || doc.body).append(this.dropOverlay);
      this.dragDepth++;
      setDragging(true);
    });
    window.addEventListener('dragover', (e) => {
      if (!hasFiles(e)) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = blocked() ? 'none' : 'copy';
    });
    window.addEventListener('dragleave', (e) => {
      if (!hasFiles(e)) return;
      this.dragDepth = Math.max(0, this.dragDepth - 1);
      if (!this.dragDepth) setDragging(false);
    });
    window.addEventListener('drop', (e) => {
      if (!hasFiles(e)) return;
      e.preventDefault();
      this.dragDepth = 0;
      setDragging(false);
      if (!blocked()) this.addFiles(e.dataTransfer.files);
    });
  }

  setThread(runtime) {
    if (this.runtime) this.drafts.set(this.runtime.id, { text: this.input.value, attachments: this.attachments });
    this.stopDictation();
    this.runtime = runtime;
    const draft = this.drafts.get(runtime.id);
    this.input.value = draft?.text || '';
    this.attachments = draft?.attachments || [];
    this.renderAttachments();
    this.autosize();
    this.sync();
  }

  autosize() {
    this.input.style.height = 'auto';
    this.input.style.height = `${this.input.scrollHeight}px`;
  }

  /** Reflects runtime + composer state in the buttons (Send ⇄ Stop, disabled, dictation, model label). */
  sync() {
    const running = !!this.runtime?.isRunning;
    this.sendButton.hidden = running;
    this.cancelButton.hidden = !running;
    this.sendButton.disabled = this.isEmpty || this.busy > 0;
    const canDictate = !!SpeechRecognitionImpl;
    this.dictate.hidden = !canDictate || !!this.dictation;
    this.stopDictate.hidden = !canDictate || !this.dictation;
    const settings = this.app.settings;
    const label = settings.modelLabel();
    this.modelLabel.textContent = label || 'Select a model';
    this.modelButton.dataset.warn = String(!label || settings.status(settings.provider.id) === 'off');
    this.modelButton.setAttribute('aria-label', label ? `Model: ${label}` : 'Select a model');
  }

  onKeyDown(e) {
    if (e.isComposing || e.keyCode === 229) return;
    if (e.key !== 'Enter' || e.shiftKey) return;
    const ctrlMode = this.app.settings.get('submitMode') === 'ctrlEnter';
    if (ctrlMode && !(e.ctrlKey || e.metaKey)) return;
    e.preventDefault();
    this.send();
  }

  send() {
    if (this.runtime.isRunning || this.isEmpty || this.busy > 0) return;
    if (!this.app.chat.ready) { toast(this.app.chat.native.message || NATIVE_ONLY, { type: 'error' }); return; }
    const text = this.input.value.trim();
    const attachments = this.attachments;
    this.stopDictation();
    this.input.value = '';
    this.attachments = [];
    this.renderAttachments();
    this.autosize();
    this.thread.send(text, attachments);
  }

  async addFiles(fileList) {
    const files = [...(fileList || [])];
    if (!files.length) return;
    this.busy++;
    this.sync();
    const target = this.runtime;
    for (const file of files) {
      try {
        const attachment = await fileToAttachment(file);
        if (this.runtime !== target) break;
        this.attachments = [...this.attachments, attachment];
        this.renderAttachments();
      } catch (e) {
        toast(e?.message || 'That file could not be attached.', { type: 'error' });
      }
    }
    this.busy--;
    this.sync();
    this.thread.syncSuggestions();
    this.input.focus({ preventScroll: true });
  }

  renderAttachments() {
    this.attachmentRow.replaceChildren(...this.attachments.map((a) => attachmentTile(a, {
      onPreview: (src, name) => this.app.previewImage(src, name),
      onRemove: () => {
        this.attachments = this.attachments.filter((x) => x !== a);
        this.renderAttachments();
        this.sync();
        this.thread.syncSuggestions();
        this.input.focus({ preventScroll: true });
      },
    })));
  }

  startDictation() {
    if (!SpeechRecognitionImpl || this.dictation) return;
    const recognition = new SpeechRecognitionImpl();
    recognition.continuous = true;
    recognition.interimResults = true;
    recognition.lang = this.app.settings.get('voiceLang') || 'bn-BD';
    const base = this.input.value;
    let finalText = '';
    recognition.onresult = (e) => {
      let interim = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const result = e.results[i];
        if (result.isFinal) finalText += result[0].transcript;
        else interim += result[0].transcript;
      }
      const spoken = (finalText + interim).trim();
      this.input.value = base && spoken ? `${base.replace(/\s+$/, '')} ${spoken}` : base || spoken;
      this.autosize();
      this.sync();
      this.thread.syncSuggestions();
    };
    recognition.onerror = (e) => {
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed') toast('Microphone access is blocked for this page.', { type: 'error' });
      else if (e.error !== 'aborted' && e.error !== 'no-speech') toast(`Voice input stopped (${e.error}).`, { type: 'error' });
    };
    recognition.onend = () => { if (this.dictation === recognition) { this.dictation = null; this.sync(); } };
    try {
      recognition.start();
      this.dictation = recognition;
      this.sync();
      this.stopDictate.focus({ preventScroll: true });
    } catch {
      toast('Voice input is not available here.', { type: 'error' });
    }
  }

  stopDictation() {
    if (!this.dictation) return;
    const recognition = this.dictation;
    this.dictation = null;
    try { recognition.stop(); } catch { /* already stopped */ }
    this.sync();
    if (doc.activeElement === this.stopDictate || doc.activeElement === doc.body) this.dictate.focus({ preventScroll: true });
  }
}
const hasFiles = (e) => [...(e.dataTransfer?.types || [])].includes('Files');

    this.viewport.addEventListener('pointerdown', (e) => { if (e.target === this.viewport) release(); }); // scrollbar
    this.viewport.addEventListener('keydown', (e) => {
      const scrollKey = ['ArrowUp', 'ArrowDown', 'PageUp', 'PageDown', 'Home', 'End', ' '].includes(e.key);
      if (scrollKey && !e.target.closest('textarea, input, select, button, [contenteditable]')) release();

    const observer = new ResizeObserver(() => { this.applyAnchor(); this.syncFollowupFades(); });
    observer.observe(this.viewport);
    observer.observe(this.group);
    observer.observe(this.footer);

  setThread(runtime) {
    for (const off of this.unsubscribe) off();
    for (const view of this.views.values()) view.destroy();
    this.views.clear();
    this.group.replaceChildren();
    Speech.stop();
    this.runtime = runtime;
    this.anchor = null;
    this.setReserve(0);
    this.unsubscribe = [
      runtime.on('change', () => this.schedule.schedule()),
      runtime.on('runStart', ({ parentId, resumed }) => {
        // A new turn is brought to the top. A run resuming after an approval leaves the reader where they are.
        if (!resumed) this.anchor = { id: parentId, scrolled: false };
        this.status.textContent = 'The assistant is responding.';
      }),
      runtime.on('runEnd', ({ messageId }) => {
        const status = runtime.repository.has(messageId) ? runtime.repository.getMessage(messageId).message.status : null;
        this.status.textContent = status?.type === 'complete' ? 'Response complete.'
          : status?.type === 'requires-action' ? 'The assistant is waiting for your approval.'
          : status?.reason === 'error' ? 'The response failed.' : 'Response stopped.';

    this.schedule.flush();
    this.scrollToBottom('instant');
    this.syncScrollButton();
  }

  /* ---------- actions ---------- */
  send(text, attachments = []) {
    this.runtime.append({ parentId: this.runtime.headId, text, attachments });
  }

  async onGroupClick(e) {
    const link = e.target.closest?.('a[href]');
    if (link && env.sandboxed) {
      // A sandboxed preview cannot open new tabs; rather than a dead link, hand over the address.
      e.preventDefault();
      const copied = await copyText(link.href);
      toast(copied ? "This preview can't open links, so the address was copied instead." : `This preview can't open links: ${link.href}`);
      return;
    }
    const button = e.target.closest?.('[data-action="copy-code"]');
    if (!button) return;
    const code = button.closest('.aui-code-block')?.querySelector('code');
    if (!code) return;
    if (!(await copyText(code.textContent))) { toast("Couldn't copy to the clipboard.", { type: 'error' }); return; }
    button.innerHTML = svgHtml('check', 'animate-in fade-in zoom-in-50 dur-200');
    button.dataset.tooltip = 'Copied';
    setTimeout(() => {
      if (!button.isConnected) return;
      button.innerHTML = svgHtml('copy', 'animate-in fade-in zoom-in-75');
      button.dataset.tooltip = 'Copy';
    }, 3000);
  }

  /* ---------- rendering ---------- */
  render() {
    const runtime = this.runtime;
    if (!runtime) return;
    const messages = runtime.messages;
    const running = runtime.isRunning;
    const empty = messages.length === 0;

    // Keep focus on the same branch arrow when a branch switch swaps the message underneath it.
    const active = doc.activeElement;
    const branchFocus = active?.dataset?.branch && this.group.contains(active)
      ? { which: active.dataset.branch, index: [...this.group.children].indexOf(active.closest('.aui-message')) }
      : null;

    this.inner.dataset.empty = String(empty);
    this.welcome.hidden = !empty;

    const next = new Map();
    let cursor = this.group.firstChild;
    messages.forEach((message, index) => {
      let view = this.views.get(message.id);
      if (!view) view = message.role === 'user' ? new UserMessageView(this, message) : new AssistantMessageView(this, message);
      view.update(message, { isLast: index === messages.length - 1, running });
      next.set(message.id, view);
      if (view.el === cursor) cursor = cursor.nextSibling;
      else this.group.insertBefore(view.el, cursor);
    });
    for (const [id, view] of this.views) {
      if (!next.has(id)) { view.destroy(); view.el.remove(); }
    }
    this.views = next;

    if (branchFocus && !this.group.contains(doc.activeElement)) {
      const host = this.group.children[branchFocus.index];
      const target = host?.querySelector(`[data-branch="${branchFocus.which}"]:not(:disabled)`) || host?.querySelector('[data-branch]:not(:disabled)');
      target?.focus({ preventScroll: true });
    }

    this.composer.sync();
    this.syncSuggestions();
    this.anchorSchedule.schedule();
    this.syncScrollButton();
  }

  syncSuggestions() {
    const runtime = this.runtime;
    if (!runtime) return;
    const empty = runtime.isEmpty;

    // Welcome suggestions: only for a new chat with nothing typed.
    const showWelcome = empty && this.composer.isEmpty;
    const welcomeKey = showWelcome ? 'agent' : '';
    if (welcomeKey !== this.welcomeKey) {
      this.welcomeKey = welcomeKey;
      this.suggestions.replaceChildren(...(showWelcome ? this.app.welcomeSuggestions().map((s, i) =>
        h('div', { class: 'animate-in fade-in slide-up-2 dur-200', style: { animationDelay: `${i * 40}ms` } },
          h('button', { type: 'button', class: 'aui-thread-welcome-suggestion', onclick: () => this.send(s.prompt) },
            h('span', { class: 'aui-thread-welcome-suggestion-mark', 'aria-hidden': 'true' }, '>'),
            h('span', { class: 'aui-thread-welcome-suggestion-body truncate' },
              h('span', { class: 'aui-thread-welcome-suggestion-text-1' }, s.title), ' ',
              h('span', { class: 'aui-thread-welcome-suggestion-text-2' }, s.description))))) : []));
    }
    this.suggestions.hidden = !showWelcome;

    // Outside the app, or before a key is saved, say what is missing and offer the way there.
    const settings = this.app.settings;
    const provider = settings.provider;
    const native = this.app.chat.native;
    const missing = native.phase === 'unavailable' || native.phase === 'error' ? native.message
      : native.phase === 'starting' ? ''
      : settings.status(provider.id) === 'off' ? `Add your ${provider.label} API key, or switch to the Free Router.` : '';
    const setupKey = empty && missing ? `${native.phase}|${provider.id}|${missing}` : '';
    if (setupKey !== this.setupKey) {
      this.setupKey = setupKey;
      const inApp = native.phase === 'ready';
      this.welcomeSetup.replaceChildren(...(setupKey ? [h('span', null, missing),
        inApp && h('button', { type: 'button', class: 'btn btn-outline btn-sm', onclick: () => this.app.openSettings('providers', provider.id) }, icon('key-round'), `Set up ${provider.label}`)].filter(Boolean) : []));
      this.welcomeSetup.hidden = !setupKey;
      this.welcomeSetup.dataset.native = native.phase;
    }

    // Follow-ups: after a reply has settled.
    const list = !empty && !runtime.isRunning ? runtime.suggestions : [];
    const followKey = list.map((s) => s.prompt).join('\u0000');
    if (followKey !== this.followKey) {
      this.followKey = followKey;
      this.followups.replaceChildren(h('div', { class: 'aui-thread-followup-inner' }, list.map((s) =>
        h('button', { type: 'button', class: 'aui-thread-followup-suggestion animate-in fade-in slide-up-1 dur-200', onclick: () => this.send(s.prompt) }, s.title || s.prompt))));
    }
    this.followups.hidden = list.length === 0;
    this.syncFollowupFades();
  }

  /** Fades whichever edge of the follow-up row has more chips scrolled out of view. */
  syncFollowupFades() {
    const el = this.followups;
    if (el.hidden) return;
    const max = el.scrollWidth - el.clientWidth;
    const fromStart = Math.abs(el.scrollLeft);
    const rtl = getComputedStyle(el).direction === 'rtl';
    const left = (rtl ? max - fromStart : fromStart) > 1;
    const right = (rtl ? fromStart : max - fromStart) > 1;
    const mask = left || right
      ? `linear-gradient(to right, ${left ? 'transparent, black 2rem' : 'black'}, ${right ? 'black calc(100% - 2rem), transparent' : 'black'})`
      : '';

  }

  /* ---------- scrolling: `turnAnchor="top"` ----------
     When a turn starts, the user's message is scrolled to the top of the
     viewport and a spacer reserves room beneath the reply, so the answer
     streams into view without the page chasing it. */
  setReserve(px) {
    if (Math.abs(px - this.reserveHeight) < 0.5) return false;
    this.reserveHeight = px;
    this.reserve.style.height = `${px}px`;
    return true;
  }

  applyAnchor() {
    const anchor = this.anchor;
    const view = anchor && this.views.get(anchor.id);
    if (!view || !view.el.isConnected) { this.setReserve(0); this.syncScrollButton(); return; }
    const viewport = this.viewport;
    const anchorHeight = view.el.offsetHeight;
    const em = parseFloat(getComputedStyle(viewport).fontSize) || 16;
    const visible = anchorHeight <= 10 * em ? anchorHeight : 6 * em; // tall messages keep only a strip in view
    // Layout offsets, not visual rects: the entrance animation must not shift the scroll target.
    let anchorTop = 0;
    for (let node = view.el; node && node !== viewport; node = node.offsetParent) anchorTop += node.offsetTop;
    const target = Math.max(0, Math.round(anchorTop - TOP_ANCHOR_GAP + Math.max(0, anchorHeight - visible)));
    // The spacer makes the page just tall enough for `target` to be reachable. While the content is shorter
    // than the viewport, scrollHeight itself depends on the spacer, so this takes a pass or two to settle.
    for (let pass = 0; pass < 4; pass++) {
      const contentHeight = viewport.scrollHeight - this.reserve.offsetHeight;
      if (!this.setReserve(Math.max(0, target + viewport.clientHeight - contentHeight))) break;
    }
    anchor.target = target;
    const off = Math.abs(viewport.scrollTop - target) > 1;
    if (!anchor.scrolled) {
      anchor.scrolled = true;
      anchor.pinned = true;
      if (off) {
        const smooth = !env.reducedMotion();
        this.autoScrollUntil = smooth ? performance.now() + 1200 : 0;
        viewport.scrollTo({ top: target, behavior: smooth ? 'smooth' : 'instant' });
        // `scrollend` settles this sooner where it exists; the timer covers browsers without it.
        if (smooth) setTimeout(() => { if (this.autoScrollUntil) { this.autoScrollUntil = 0; this.applyAnchor(); } }, 1250);
      }
    } else if (anchor.pinned && off && performance.now() >= this.autoScrollUntil) {
      // Content shrank (a reasoning panel collapsing, say) and the browser clamped the scroll position.
      // The reader has not scrolled, so put the turn back where it was.
      viewport.scrollTo({ top: target, behavior: 'instant' });
    }
    this.syncScrollButton();
  }

  onScroll() { this.syncScrollButton(); }

  scrollToBottom(behavior = 'smooth') {
    this.viewport.scrollTo({ top: this.viewport.scrollHeight, behavior: env.reducedMotion() ? 'instant' : behavior });
  }

  syncScrollButton() {
    const v = this.viewport;
    // Offered once at least a line of content is out of view below; not for a few stray pixels.
    this.scrollButton.disabled = v.scrollHeight - v.scrollTop - v.clientHeight < 24;
  }

  focusComposer() {
    if (!env.coarse()) this.composer.input.focus({ preventScroll: true });
  }
}

   App shell: sidebar with the thread list, top bar, model picker, settings.

const APP_NAME = 'AI Chat';

const startOfDay = (date) => new Date(date.getFullYear(), date.getMonth(), date.getDate()).getTime();
function dateGroup(timestamp, now = new Date()) {
  const today = startOfDay(now);
  if (!timestamp || timestamp >= today) return 'Today';
  const yesterday = new Date(today);
  yesterday.setDate(yesterday.getDate() - 1);
  return timestamp >= yesterday.getTime() ? 'Yesterday' : 'Earlier';
}

class App {
  constructor(root) {

        h('button', { type: 'button', class: 'btn btn-ghost btn-icon-xs', 'aria-label': 'Settings', 'data-tooltip': 'Settings', onclick: () => this.openSettings() }, icon('settings'))),

    window.matchMedia('(max-width: 767.98px)').addEventListener('change', () => { this.setMobileSidebar(false); this.syncSidebarA11y(); });

    doc.addEventListener('keydown', (e) => {
      if (dialogStack.length) return;

  applyTheme() {

  threadItem(thread) {

      type: 'button', class: 'aui-button-icon aui-thread-list-item-more', 'data-slot': 'aui_thread-list-item-more', 'data-thread-more': thread.id,

  /* ---------- model picker (composer) ---------- */
  /** Free Router routes first, then every provider with a saved key and the models the engine listed for it. */
  openModelPicker(trigger) {
    const settings = this.settings;
    if (!this.chat.ready) { toast(this.chat.native.message || NATIVE_ONLY, { type: 'error' }); return; }
    openPopover(trigger, (el, close) => {
      const keyed = settings.orderedProviders().filter((p) => p.needsKey && settings.status(p.id) === 'connected');
      const groups = [agentProvider('auto'), ...keyed];
      const list = h('div', { class: 'model-popover-list scroll-thin', role: 'listbox', 'aria-label': 'Models' });
      const status = h('div', { class: 'menu-label', role: 'status', hidden: true });
      const choose = (provider, id) => settings.set({ provider: provider.id, model: provider.id === 'auto' ? '' : id });
      const action = (label, iconName, onSelect, keepOpen) => {
        const item = menuItem({ label, icon: iconName, role: 'option', onSelect }, keepOpen ? () => {} : close);
        item.classList.add('is-action');
        return item;
      };
      const renderList = (query) => {
        const q = query.trim().toLowerCase();
        const children = [];
        let shown = 0;
        let hidden = 0;
        let exact = false;
        for (const provider of groups) {
          const models = settings.modelsFor(provider.id);
          const found = models.filter((m) => !q || m.id.toLowerCase().includes(q) || (m.name || '').toLowerCase().includes(q) || provider.label.toLowerCase().includes(q));
          if (models.some((m) => m.id.toLowerCase() === q)) exact = true;
          const group = h('div', { role: 'group', 'aria-label': provider.label },
            h('div', { class: 'menu-label', 'aria-hidden': 'true' },
              h('span', { class: 'provider-mark is-sm' }, provider.mark),
              h('span', { class: 'truncate' }, provider.label),
              h('span', { class: 'status-dot', 'data-status': settings.status(provider.id) }, settings.statusLabel(provider.id))));
          if (provider.id === 'auto') {
            if (!q || 'free router'.includes(q) || found.length) {
              group.append(menuItem({ label: 'Free Router (auto)', sub: provider.sub, checked: settings.get('provider') === 'auto', role: 'option', onSelect: () => choose(provider, '') }, close));
              children.push(group);
            }
            continue;
          }
          if (!models.length && !q) {
            group.append(action(`Load ${provider.label} models`, 'refresh-cw', async () => {
              try { await settings.loadModels(provider.id); renderList(searchInput.value); } catch (e) { toast(e?.message || 'Could not load the model list.', { type: 'error' }); }
            }, true));
            children.push(group);
            continue;
          }
          if (!found.length) continue;
          for (const m of found) {
            if (shown >= 80) { hidden++; continue; }
            shown++;
            const selected = provider.id === settings.get('provider') && m.id === settings.get('model');
            const sub = [m.isFree ? 'Free' : '', m.toolCalling === false ? 'No tools' : ''].filter(Boolean).join(' · ');
            group.append(menuItem({ label: m.id, sub: sub || undefined, checked: selected, role: 'option', onSelect: () => choose(provider, m.id) }, close));
          }
          children.push(group);
        }
        // A model ID the engine didn't list can be typed straight in for a provider with a key.
        const target = settings.provider.needsKey && settings.status(settings.provider.id) === 'connected' ? settings.provider : keyed[0];
        if (q && !exact && target) {
          const typed = query.trim();
          children.push(h('div', { role: 'group', 'aria-label': 'Custom model' }, action(`Use “${typed}” with ${target.label}`, 'plus', () => choose(target, typed))));
        }
        if (!keyed.length && !q) children.push(h('div', { role: 'group', 'aria-label': 'Add a provider' }, action('Add an API key for another provider…', 'key-round', () => this.openSettings('providers'))));
        const note = !children.length ? 'No models match' : hidden ? `${hidden} more. Keep typing to narrow the list.` : '';
        status.textContent = note;
        status.hidden = !note;
        list.replaceChildren(...children);
      };
      const searchInput = h('input', {
        type: 'search', class: 'input', placeholder: 'Search or type a model ID', 'aria-label': 'Search models, or type a model ID', autocomplete: 'off', spellcheck: false,
        oninput: () => renderList(searchInput.value),
        onkeydown: (e) => {
          if (e.key === 'ArrowDown') { e.preventDefault(); list.querySelector('.menu-item')?.focus(); }
          else if (e.key === 'Enter') { e.preventDefault(); list.querySelector('.menu-item')?.click(); }
        },
      });
      renderList('');
      el.append(h('div', { class: 'model-popover-search' }, icon('search'), searchInput));
      el.append(list, status, h('div', { class: 'model-popover-footer' },
        menuItem({ label: 'Manage providers…', icon: 'settings', role: null, onSelect: () => this.openSettings('providers') }, close)));
      el.addEventListener('keydown', (e) => {
        if (e.target === searchInput) return;
        if (e.key === 'ArrowUp' && doc.activeElement === el.querySelector('.model-popover-list .menu-item')) { e.preventDefault(); searchInput.focus(); return; }
        menuKeys(el, e);
      });
      const coarse = window.matchMedia('(pointer: coarse)').matches;
      requestAnimationFrame(() => ((coarse ? null : searchInput) || list.querySelector('.menu-item[aria-selected="true"]') || el.querySelector('.menu-item'))?.focus({ preventScroll: true }));
    }, { class: 'model-popover', side: 'top', align: 'start', label: 'Choose a model' });
  }

  /* ---------- settings ---------- */
  openSettings(initial = 'providers', providerId = null) {
    const settings = this.settings;
    const chat = this.chat;
    if (initial === 'model') initial = 'providers';
    const tabs = [['providers', 'Providers'], ['agent', 'Agent'], ['mcp', 'MCP'], ['automations', 'Automations'], ['memory', 'Memory'], ['general', 'General']];
    if (!tabs.some(([id]) => id === initial)) initial = 'providers';
    const panel = h('div', { role: 'tabpanel', id: 'settings-panel', tabindex: '-1' });
    let current = initial;
    let detail = providerId && AGENT_PROVIDERS.some((p) => p.id === providerId) ? providerId : null;
    let alive = true;

    const field = (label, control, hint, target = control) => {
      const id = target.id || (target.id = `f-${uid(6)}`);
      const hintEl = hint && (typeof hint === 'string' ? h('p', { class: 'field-hint' }, hint) : hint);

    const errorText = (e) => redactSecrets(e?.message || String(e), 300);
    /** Runs a native call; shows a toast on failure. Returns undefined when it failed. */
    const run = async (fn, okText) => {
      try { const r = await fn(); if (okText) toast(okText, { type: 'success' }); return r ?? true; } catch (e) { toast(errorText(e), { type: 'error' }); return undefined; }
    };
    /** A section whose content comes from native calls: a loading line first, then build(). */
    const asyncSection = (build) => {
      const wrap = h('div', { class: 'settings-section' }, loading());
      const refresh = async () => {
        try {
          const nodes = await build(refresh);
          if (alive) wrap.replaceChildren(...[].concat(nodes).filter(Boolean));
        } catch (e) {
          if (alive) wrap.replaceChildren(note(errorText(e), 'error'), h('div', null, h('button', { type: 'button', class: 'btn btn-outline btn-sm', onclick: refresh }, icon('refresh-cw'), 'Try again')));

      return wrap;
    };
    const appOnly = () => h('div', { class: 'settings-section' }, note(chat.native.phase === 'starting' ? 'The agent is still starting. Try again in a moment.' : chat.native.message || NATIVE_ONLY, chat.native.phase === 'error' ? 'error' : 'info'));
    const numberInput = (value, attrs) => h('input', { class: 'input', type: 'number', inputmode: 'decimal', value: value ?? '', ...attrs });

    const providerRow = (p, sortable) => {

      return h('li', { class: 'provider-row', 'data-id': p.id },

        h('button', { type: 'button', class: 'provider-row-main', 'aria-label': `${p.label}, ${settings.statusLabel(p.id)}${active ? ', in use' : ''}`, onclick: () => openDetail(p.id) },
          h('span', { class: 'provider-mark', 'aria-hidden': 'true' }, p.mark),
          h('span', { class: 'provider-text' },
            h('span', { class: 'provider-name' }, h('span', { class: 'truncate' }, p.label), active && h('span', { class: 'chip' }, 'In use')),
            h('span', { class: 'provider-sub truncate' }, statusDot(p.id), model ? ` · ${model}` : '')),
          icon('chevron-right', 'chevron-end')));
    };
    const providerList = () => {
      const out = [];
      if (!chat.ready) out.push(note(chat.native.message || NATIVE_ONLY));
      out.push(h('p', { class: 'field-hint' }, 'Keys are saved by the app in its own key store, never in this page. Drag the handle to change the order the model picker shows them in.'));
      const route = agentProvider('auto');
      out.push(h('div', { class: 'provider-group' }, h('div', { class: 'provider-group-label' }, 'Free'),
        h('ul', { class: 'provider-list', role: 'list' }, providerRow(route, false))));

      const ids = () => settings.orderedProviders().filter((p) => p.needsKey).map((p) => p.id);

      render();
      makeSortable(ul, {
        item: '.provider-row', handle: '.drag-handle',
        onReorder: (from, to, opts) => {
          const before = ids();
          settings.set({ providerOrder: moveItem(before, from, to) });
          render();
          if (opts?.keyboard) ul.querySelector(`[data-id="${before[from]}"] .drag-handle`)?.focus();
        },
      });
      out.push(h('div', { class: 'provider-group' }, h('div', { class: 'provider-group-label', id: labelId }, 'With your API key'), ul));
      out.push(h('div', { class: 'provider-group' }, h('div', { class: 'provider-group-label' }, 'On device'),
        h('ul', { class: 'provider-list', role: 'list' }, providerRow(agentProvider('webllm'), false))));
      return h('div', { class: 'settings-section' }, out);
    };

    const providerDetail = (id) => {
      const p = agentProvider(id);
      const out = [];
      const back = h('button', { type: 'button', class: 'btn btn-ghost btn-sm provider-back', onclick: () => {
        detail = null;

        panel.querySelector(`[data-id="${id}"] .provider-row-main`)?.focus();
      } }, icon('chevron-left'), 'All providers');
      const headStatus = h('span', { class: 'provider-sub' });
      const useBtn = h('button', { type: 'button', class: 'btn btn-sm', onclick: () => { settings.set({ provider: id, model: id === settings.get('provider') ? settings.get('model') : '' }); sync(); } });
      const sync = () => {
        const active = settings.get('provider') === id;
        useBtn.className = `btn btn-sm ${active ? 'btn-outline' : 'btn-default'}`;
        useBtn.disabled = active;
        useBtn.replaceChildren(...(active ? [icon('check'), 'In use'] : ['Use']));
        headStatus.replaceChildren(statusDot(id));
      };
      sync();
      out.push(h('div', null, back));
      out.push(h('div', { class: 'provider-detail-head' },
        h('span', { class: 'provider-mark', 'aria-hidden': 'true' }, p.mark),
        h('span', { class: 'provider-text' }, h('span', { class: 'provider-name' }, p.label), headStatus),
        useBtn));

      if (p.id === 'auto') {
        out.push(h('p', { class: 'field-hint' }, 'The Free Router sends each chat to a free model only. It tries Kilo first (no key needed), then OpenRouter’s free route (needs your OpenRouter key). Paid models, and models whose price is unknown, are blocked.'));
        out.push(h('ul', { class: 'route-list' }, ...FREE_ROUTES.map((r) => h('li', null,
          h('span', { class: 'provider-mark is-sm' }, agentProvider(r.provider).mark),
          h('span', { class: 'route-text' }, h('strong', null, r.label), h('code', null, `${r.provider}/${r.model}`)),
          h('span', { class: 'status-dot', 'data-status': r.anonymous || settings.status(r.provider) === 'connected' ? 'connected' : 'off' }, r.anonymous ? 'No key needed' : settings.status(r.provider) === 'connected' ? 'Key saved' : 'Needs OpenRouter key')))));
        out.push(asyncSection(async () => {
          const cfg = (await bridge.getRuntimeConfig()) || {};
          const ar = cfg.autoRouting || {};
          const failover = h('input', { type: 'checkbox', class: 'switch', role: 'switch', checked: ar.failoverOnTransient !== false, id: `s-${uid(6)}` });
          const fallbacks = numberInput(ar.maxFallbacks ?? 3, { min: '0', max: '10', step: '1', 'data-label': 'Fallbacks' });
          const save = h('button', { type: 'button', class: 'btn btn-default btn-sm', onclick: async () => {
            let maxFallbacks;

            await run(() => bridge.setRuntimeConfig({

            h('div', { class: 'switch-row' }, h('div', null, h('label', { class: 'field-label', for: failover.id }, 'Try the next route on a temporary error'), h('p', { class: 'field-hint' }, 'For timeouts, rate limits and server errors.')), failover),

          onConfirm: async () => { if (await run(() => bridge.deleteAuth(id), 'Key removed.')) { await settings.refreshFromNative(); sync(); } },
        }) }, icon('trash'), 'Remove key')));

      // Models: getModels(provider) -> modelsJson.

    /* ----- Agent: runtime config and tool permissions ----- */
    const agentSection = () => asyncSection(async (refresh) => {
      const cfg = (await bridge.getRuntimeConfig()) || {};
      const turns = numberInput(cfg.defaultMaxTurns, { min: '1', max: '100', step: '1', 'data-label': 'Max turns' });
      const tokens = numberInput(cfg.maxTokens, { min: '256', max: '200000', step: '1', 'data-label': 'Max output tokens' });
      const temp = numberInput(cfg.temperature, { min: '0', max: '2', step: '0.1', 'data-label': 'Temperature' });
      const budget = numberInput(cfg.contextCharBudget, { min: '10000', max: '1000000', step: '1000', 'data-label': 'Context budget' });
      const timeout = numberInput(cfg.mcpToolTimeoutMs ? Math.round(cfg.mcpToolTimeoutMs / 1000) : '', { min: '1', max: '300', step: '1', 'data-label': 'MCP tool timeout' });
      const save = h('button', { type: 'button', class: 'btn btn-default btn-sm', onclick: async () => {
        let patch;

/* ---------- responsive helpers ---------- */
/* Keeps --app-height equal to the visible viewport, so the composer and dialogs stay above an on-screen

  update(el) {

Tooltip.init();
ViewportHeight.init();
ScrollHints.init();
