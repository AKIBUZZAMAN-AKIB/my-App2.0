<!doctype html>
<!--
  AI Chat: a complete chat app in one self-contained HTML file. No build step, no network needed to open it.

  It re-implements the architecture of assistant-ui (https://github.com/assistant-ui/assistant-ui) in plain
  JavaScript: a runtime per agent session that follows the native engine's events, tool cards with human
  approval, and UI pieces that mirror its Thread, Composer, Message, ActionBar and ThreadList primitives.
  The layout is responsive from 320px phones to desktops, in portrait and landscape; wide content (tables,
  code, tabs, chips) scrolls sideways inside its own box so the page itself never does.

  Credits: design tokens, class names and component anatomy follow assistant-ui's starter kit (MIT).
  Icons are from Lucide (ISC). The agent runs in the app's native engine (window.NativeKit); this page makes no network calls of its own.
-->

(function () {

  var dark = theme === 'dark' || (theme !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);

/* ==========================================================================

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {

  background: var(--background);

  font-family: var(--font-sans);
  font-size: 1rem;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;

ul, ol { margin: 0; padding: 0; }
button, input, textarea, select { font: inherit; color: inherit; letter-spacing: inherit; }
button {
  appearance: none;
  -webkit-appearance: none;
  border: 0;
  padding: 0;
  margin: 0;
  background: none;
  cursor: pointer;
  text-align: inherit;
  -webkit-tap-highlight-color: transparent;
}

[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
::placeholder { color: var(--muted-foreground); opacity: 1; }

.sr-only {

  overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
}
.icon { width: 1rem; height: 1rem; flex-shrink: 0; pointer-events: none; }

.scroll-thin { scrollbar-width: thin; scrollbar-color: var(--fg-25) transparent; }

/* ==========================================================================

@keyframes aui-enter {
  from {
    opacity: var(--enter-opacity, 1);
    transform: translate3d(var(--enter-x, 0), var(--enter-y, 0), 0) scale(var(--enter-scale, 1));
    filter: blur(var(--enter-blur, 0));
  }
}
@keyframes aui-exit {
  to {
    opacity: var(--exit-opacity, 1);
    transform: translate3d(var(--exit-x, 0), var(--exit-y, 0), 0) scale(var(--exit-scale, 1));
  }
}
@keyframes aui-spin { to { transform: rotate(360deg); } }
@keyframes aui-pulse { 50% { opacity: 0.5; } }
@keyframes aui-shimmer { from { background-position: 100% 0; } to { background-position: -100% 0; } }

.animate-in { animation: aui-enter 150ms ease-out both; }
.fade-in { --enter-opacity: 0; }
.slide-up-1 { --enter-y: 0.25rem; }
.slide-up-2 { --enter-y: 0.5rem; }
.zoom-in-50 { --enter-scale: 0.5; }
.zoom-in-75 { --enter-scale: 0.75; }
.zoom-in-95 { --enter-scale: 0.95; }
.dur-200 { animation-duration: 200ms; }
.dur-300 { animation-duration: 300ms; }
.spin { animation: aui-spin 1s linear infinite; }
.spin-fast { animation: aui-spin 0.6s linear infinite; }
.pulse { animation: aui-pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }

/* Port of the `shimmer` text sweep from tw-shimmer: a soft band travels across the label. */
.shimmer { position: relative; }
@supports ((background-clip: text) or (-webkit-background-clip: text)) {
  .shimmer {
    --shimmer-hi: color-mix(in oklab, currentColor 25%, transparent);
    background: linear-gradient(100deg, currentColor 35%, var(--shimmer-hi) 50%, currentColor 65%) 0 0 / 200% 100% repeat-x;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: aui-shimmer 1.5s linear infinite;
  }
  .dark .shimmer { --shimmer-hi: oklch(1 0 0); }
}

@media (prefers-reduced-motion: reduce) {
  .animate-in { animation: none; }
  .shimmer { animation: none; background: none; -webkit-text-fill-color: currentColor; }

.switch {
  appearance: none; -webkit-appearance: none;
  position: relative; flex-shrink: 0;

/* ==========================================================================

   ========================================================================== */
#portal { position: fixed; inset: 0; pointer-events: none; z-index: 50; }

.tooltip {

        const ind = indentOf(l);
        if (ind >= contentIndent) { itemLines.push(l.slice(contentIndent)); i++; continue; }
        if (ind >= markerIndent + 2 && RE_ITEM.test(l)) { itemLines.push(l.slice(ind)); i++; continue; }
        if (RE_ITEM.test(l) || interruptsParagraph(l)) break;
        if (!isBlank(itemLines[itemLines.length - 1])) { itemLines.push(l.trimStart()); i++; continue; }
        break;
      }
      let checked = null;
      const task = /^\[([ xX])\](?:[ \t]+|$)/.exec(itemLines[0]);
      if (task) { checked = task[1] !== ' '; itemLines[0] = itemLines[0].slice(task[0].length); }
      const blocks = parseBlocks(itemLines);
      if (blankInside && blocks.length > 1) list.tight = false;
      list.items.push({ blocks, checked });
      let k = i;
      while (k < n && isBlank(lines[k])) k++;
      if (k > i) {
        if (k < n && sameList(RE_ITEM.exec(lines[k]), lines[k])) { list.tight = false; i = k; continue; }
        break;
      }
    }
    return [list, i];
  }

  function parseTable(lines, i) {
    const n = lines.length;
    const header = splitRow(lines[i]);
    const align = splitRow(lines[i + 1]).map((c) => {
      const l = c.startsWith(':');
      const r = c.endsWith(':');
      return l && r ? 'center' : r ? 'right' : l ? 'left' : null;
    });
    const rows = [];
    i += 2;
    while (i < n && !isBlank(lines[i]) && lines[i].includes('|') && !fenceOpen(lines[i])) {
      const cells = splitRow(lines[i]);
      while (cells.length < header.length) cells.push('');
      rows.push(cells.slice(0, header.length));
      i++;
    }
    return [{ type: 'table', header, align, rows }, i];
  }

  function parseBlocks(lines) {
    const blocks = [];
    const n = lines.length;
    let i = 0;
    while (i < n) {
      const line = lines[i];
      if (isBlank(line)) { i++; continue; }
      const s = i;
      let block;
      let m;
      const f = fenceOpen(line);
      if (f) {
        const body = [];
        let closed = false;
        i++;
        while (i < n) {
          const l = lines[i];
          const cm = /^ {0,3}(`{3,}|~{3,})[ \t]*$/.exec(l);
          if (cm && cm[1][0] === f.ch && cm[1].length >= f.len) { closed = true; i++; break; }
          body.push(f.indent ? l.replace(new RegExp(`^ {0,${f.indent}}`), '') : l);
          i++;
        }
        block = { type: 'code', lang: f.lang.toLowerCase().replace(/[^a-z0-9+#._-]/g, ''), text: body.join('\n'), closed };
      } else if ((m = RE_MATH_OPEN.exec(line)) && mathBlockEnd(lines, i, m[1]) >= 0) {
        const end = mathBlockEnd(lines, i, m[1]);
        const closer = m[1] === '$$' ? '$$' : '\\]';
        let text = lines.slice(i, end + 1).join('\n').trim().slice(2);
        if (text.endsWith(closer)) text = text.slice(0, -closer.length);
        block = { type: 'math', text: text.trim() };
        i = end + 1;
      } else if ((m = RE_HEADING.exec(line))) {
        block = { type: 'heading', level: m[1].length, text: (m[2] || '').replace(/(?:^|[ \t]+)#+[ \t]*$/, '') };
        i++;
      } else if (RE_HR.test(line)) {
        block = { type: 'hr' };
        i++;
      } else if (RE_BQ.test(line)) {
        const inner = [];
        while (i < n) {
          const l = lines[i];
          if (RE_BQ.test(l)) inner.push(l.replace(RE_BQ, ''));
          else if (!isBlank(l) && inner.length && !isBlank(inner[inner.length - 1]) && !interruptsParagraph(l)) inner.push(l);
          else break;
          i++;
        }
        block = { type: 'blockquote', blocks: parseBlocks(inner) };
      } else if (isListStart(line)) {
        [block, i] = parseList(lines, i);
      } else if (isTableStart(lines, i)) {
        [block, i] = parseTable(lines, i);
      } else {
        const para = [];
        while (i < n) {
          const l = lines[i];
          if (isBlank(l)) break;
          if (para.length && (interruptsParagraph(l) || isTableStart(lines, i))) break;
          para.push(l.replace(/^[ \t]+/, ''));
          i++;
        }
        block = { type: 'paragraph', text: para.join('\n').replace(/[ \t]+$/, '') };
      }
      block.s = s;
      block.e = i;
      blocks.push(block);
    }
    return blocks;
  }

  const COPY_BUTTON = `<button type="button" class="aui-button-icon" data-action="copy-code" data-tooltip="Copy" aria-label="Copy code">${svgHtml('copy')}</button>`;

  function blockHtml(b, o) {
    switch (b.type) {
      case 'heading': return `<h${b.level}>${inline(b.text, o)}</h${b.level}>`;
      case 'paragraph': return o.tight ? inline(b.text, o) : `<p>${inline(b.text, o)}</p>`;
      case 'hr': return '<hr>';
      case 'math': return `<div class="aui-md-math-block"><code>${esc(b.text)}</code></div>`;
      case 'code':
        return `<div class="aui-code-block"><div class="aui-code-header-root"><span class="aui-code-header-language">${esc(b.lang)}</span>${COPY_BUTTON}</div><pre class="aui-md-pre"><code>${highlight(b.text, b.lang)}</code></pre></div>`;
      case 'blockquote': return `<blockquote>${blocksHtml(b.blocks, { streaming: o.streaming })}</blockquote>`;
      case 'list': {
        const tag = b.ordered ? 'ol' : 'ul';
        const start = b.ordered && b.start !== 1 ? ` start="${b.start}"` : '';
        const items = b.items.map((it, idx) => {
          const body = blocksHtml(it.blocks, { streaming: o.streaming && idx === b.items.length - 1, tight: b.tight });
          if (it.checked === null) return `<li>${body}</li>`;
          return `<li class="aui-md-task"><input type="checkbox" disabled${it.checked ? ' checked' : ''} aria-label="${it.checked ? 'Done' : 'Not done'}">${body}</li>`;
        });
        return `<${tag}${start}>${items.join('')}</${tag}>`;
      }
      case 'table': {
        const cell = (tag, text, idx) => `<${tag}${b.align[idx] ? ` align="${b.align[idx]}"` : ''}>${inline(text, {})}</${tag}>`;
        const head = `<thead><tr>${b.header.map((c, idx) => cell('th', c, idx)).join('')}</tr></thead>`;
        const body = b.rows.length ? `<tbody>${b.rows.map((r) => `<tr>${r.map((c, idx) => cell('td', c, idx)).join('')}</tr>`).join('')}</tbody>` : '';
        return `<div class="aui-md-table-wrapper"><table>${head}${body}</table></div>`;
      }
      default: return '';
    }
  }
  const blocksHtml = (blocks, o) =>
    blocks.map((b, i) => blockHtml(b, { ...o, streaming: !!o.streaming && i === blocks.length - 1 })).join('');

  const toLines = (src) =>
    String(src).replace(/\r\n?/g, '\n').split('\n').map((l) => (l.includes('\t') ? l.replace(/^[ \t]+/, (ws) => ws.replace(/\t/g, '    ')) : l));

  const toHtml = (src, o = {}) => blocksHtml(parseBlocks(toLines(src)), { streaming: !!o.streaming });

  /**
   * Renders into `container`, reusing the DOM of blocks whose source did not
   * change. While a reply streams only its last block is rebuilt per frame.
   */
  const template = doc ? doc.createElement('template') : null;
  function render(container, src, o = {}) {
    const lines = toLines(src);
    const blocks = parseBlocks(lines);
    const prev = container._md || [];
    const next = [];
    for (let i = 0; i < blocks.length; i++) {
      const b = blocks[i];
      const streaming = !!o.streaming && i === blocks.length - 1;
      const key = `${b.type}${streaming ? '\u0001' : '\u0000'}${lines.slice(b.s, b.e).join('\n')}`;
      const old = prev[i];
      if (old && old.key === key) { next.push(old); continue; }
      let el;
      if (old && b.type === 'code' && old.type === 'code' && old.lang === b.lang) {
        el = old.el;
        el.querySelector('code').innerHTML = highlight(b.text, b.lang);
      } else {
        template.innerHTML = blockHtml(b, { streaming });
        el = template.content.firstElementChild;
        if (old) old.el.replaceWith(el);
        else container.append(el);
      }
      next.push({ key, el, type: b.type, lang: b.lang });
    }
    for (let i = blocks.length; i < prev.length; i++) prev[i].el.remove();
    container._md = next;
  }

  /** Markdown → readable plain text (used for read-aloud). */
  function toPlainText(src) {
    template.innerHTML = toHtml(src);
    const root = template.content;
    root.querySelectorAll('.aui-code-block').forEach((el) => el.replaceWith(doc.createTextNode(' (code block) ')));
    root.querySelectorAll('p, li, h1, h2, h3, h4, h5, h6, tr, blockquote').forEach((el) => el.append(doc.createTextNode('\n')));
    return root.textContent.replace(/\n{2,}/g, '\n').trim();
  }

  return { render, toHtml, toPlainText, highlight, inline, safeHref, safeImageSrc };
})();

/* ==========================================================================
   MessageRepository — a port of assistant-ui's branch tree
   (packages/core/src/runtime/utils/message-repository.ts).

   Messages form a tree, not a list. Editing a user message or regenerating a
   reply adds a sibling instead of overwriting, and `head` selects the branch
   that is currently on screen.
   ========================================================================== */
class MessageRepository {
  constructor() {
    this.messages = new Map(); // id -> { prev, current, next, children, level }
    this.head = null;
    this.root = { children: [], next: null };
    this._cache = null;
  }

  static _findHead(node) {
    let current = node;
    while (current.next) current = current.next;
    return 'current' in current ? current : null;
  }

  _updateLevels(message, newLevel) {
    const pending = [{ message, level: newLevel }];
    while (pending.length) {
      const item = pending.pop();
      item.message.level = item.level;
      for (const childId of item.message.children) {
        const child = this.messages.get(childId);
        if (child) pending.push({ message: child, level: item.level + 1 });
      }
    }
  }

  _selectPathTo(message) {
    for (let current = message; current; current = current.prev) {
      (current.prev ?? this.root).next = current;
    }
  }

  _performOp(newParent, child, operation) {
    const parentOrRoot = child.prev ?? this.root;
    const newParentOrRoot = newParent ?? this.root;
    if (operation === 'relink' && parentOrRoot === newParentOrRoot) return;

    if (operation !== 'link') {
      parentOrRoot.children = parentOrRoot.children.filter((id) => id !== child.current.id);
      if (parentOrRoot.next === child) {
        const fallbackId = parentOrRoot.children.at(-1);
        parentOrRoot.next = fallbackId ? this.messages.get(fallbackId) ?? null : null;
      }
    }

    if (operation !== 'cut') {
      newParentOrRoot.children = [...newParentOrRoot.children, child.current.id];
      child.prev = newParent;
      if (MessageRepository._findHead(child) === this.head) {
        this._selectPathTo(child);
      } else if (newParentOrRoot.next === null) {
        newParentOrRoot.next = child;
        if (this.head === newParentOrRoot) this.head = MessageRepository._findHead(child);
      }
      this._updateLevels(child, newParent ? newParent.level + 1 : 0);
    }
  }

  get headId() { return this.head?.current.id ?? null; }

  /** The messages on the active branch, root first. */
  getMessages(headId) {
    if (headId === undefined || headId === this.headId) {
      if (!this._cache) {
        const out = new Array((this.head?.level ?? -1) + 1);
        for (let current = this.head; current; current = current.prev) out[current.level] = current.current;
        this._cache = out;
      }
      return this._cache;
    }
    const head = this.messages.get(headId);
    if (!head) throw new Error('MessageRepository(getMessages): head message not found.');
    const out = new Array(head.level + 1);
    for (let current = head; current; current = current.prev) out[current.level] = current.current;
    return out;
  }

  has(messageId) { return this.messages.has(messageId); }

  addOrUpdateMessage(parentId, message) {
    const existing = this.messages.get(message.id);
    const prev = parentId ? this.messages.get(parentId) : null;
    if (prev === undefined) throw new Error('MessageRepository(addOrUpdateMessage): parent message not found.');

    if (existing) {
      this._performOp(prev, existing, 'relink');
      existing.current = message;
      this._cache = null;
      return;
    }

    const item = { prev, current: message, next: null, children: [], level: prev ? prev.level + 1 : 0 };
    this.messages.set(message.id, item);
    this._performOp(prev, item, 'link');
    if (this.head === prev) {
      this.head = item;
      this._selectPathTo(item);
    }
    this._cache = null;
  }

  getMessage(messageId) {
    const message = this.messages.get(messageId);
    if (!message) throw new Error('MessageRepository(getMessage): message not found.');
    return { parentId: message.prev?.current.id ?? null, message: message.current, index: message.level };
  }


  switchToBranch(messageId) {
    const message = this.messages.get(messageId);
    if (!message) throw new Error('MessageRepository(switchToBranch): branch not found.');
    this._selectPathTo(message);
    this.head = MessageRepository._findHead(message);
    this._cache = null;
  }

  clear() {
    this.messages.clear();
    this.head = null;
    this.root = { children: [], next: null };
    this._cache = null;
  }

  export() {
    const items = [];
    const pending = [...this.root.children].reverse();
    while (pending.length) {
      const message = this.messages.get(pending.pop());
      if (!message) continue;
      for (let i = message.children.length - 1; i >= 0; i--) pending.push(message.children[i]);
      items.push({ parentId: message.prev?.current.id ?? null, message: message.current });
    }
    return { headId: this.headId, messages: items };
  }

  import({ headId, messages }) {
    for (const { message, parentId } of messages) {
      if (parentId !== null && !this.messages.has(parentId)) continue; // orphan: skip rather than throw
      this.addOrUpdateMessage(parentId, message);
    }
    const target = headId != null && this.messages.has(headId) ? headId : messages.at(-1)?.message.id ?? null;
    if (target === null || !this.messages.has(target)) return;
    const message = this.messages.get(target);
    this.head = message;
    this._selectPathTo(message);
    this._cache = null;
  }
}

/* ==========================================================================
   NativeKit bridge: the exact native API that agent.html (AI Workspace) uses.
   Nothing here talks to a provider or the network. Every call goes to
   window.NativeKit, which only exists inside the app. In a plain browser the
   page shows a "works only inside the app" state and sends nothing.
   ========================================================================== */

/** Paths handed to agent.initialize, identical to agent.html. */
const AGENT_PATHS = Object.freeze({
  dbPath: 'files://agent/agent.db',
  workspacePath: 'files://agent/workspace',
  authProfilesPath: 'files://agent/auth-profiles.json',
});
const AGENT_ID = 'main';
const ACTIVE_SESSION_KEY = 'nativekit.agent.workspace.active-session.v1';
const EVENT_LOG_KEY = 'nativekit.agent.workspace.event-log.v2';
const EVENT_LOG_MAX = 300;
const MCP_SERVERS_KEY = 'nativekit.agent.mcp.servers.v1';
const MCP_TOKEN_PREFIX = 'nativekit.agent.mcp.token.';
const DENIED_REASON = 'User denied this action in AI Workspace';
const NATIVE_ONLY = 'This chat runs only inside the app. Open it in the app to talk to the agent.';

/** Providers in the order agent.html lists them. `auto` is the free router. */
const AGENT_PROVIDERS = [
  { id: 'auto', label: 'Free Router', sub: 'Free Router · verified free only', mark: 'FR', needsKey: false },
  { id: 'anthropic', label: 'Anthropic', mark: 'A', needsKey: true },
  { id: 'openai', label: 'OpenAI', mark: 'O', needsKey: true },
  { id: 'gemini', label: 'Google Gemini', mark: 'G', needsKey: true },
  { id: 'openrouter', label: 'OpenRouter', mark: 'OR', needsKey: true },
  { id: 'ovhcloud', label: 'OVHcloud', mark: 'OV', needsKey: true },
  { id: 'opencode_zen', label: 'OpenCode Zen', mark: 'OZ', needsKey: true },
  { id: 'llm7', label: 'LLM7', mark: 'L7', needsKey: true },
  { id: 'kilo', label: 'Kilo', mark: 'K', needsKey: true },
  { id: 'pollinations', label: 'Pollinations', mark: 'P', needsKey: true },
  { id: 'aihorde', label: 'AI Horde', mark: 'AH', needsKey: true },
  { id: 'webllm', label: 'WebLLM (on device)', mark: 'W', needsKey: false, local: true },
];
const agentProvider = (id) => AGENT_PROVIDERS.find((p) => p.id === id) || AGENT_PROVIDERS[0];
/** Providers that take a key through setAuthKey (everything but the router and WebLLM). */
const KEY_PROVIDERS = AGENT_PROVIDERS.filter((p) => p.needsKey);

/** The free routes behind `auto`, exactly as agent.html defines them. */
const FREE_ROUTES = [
  { provider: 'kilo', model: 'kilo-auto/free', label: 'Kilo Auto Free', anonymous: true },
  { provider: 'openrouter', model: 'openrouter/free', label: 'OpenRouter Free', anonymous: false },
];

/** Default tool permissions agent.html seeds with seedToolPermissions. */
/**
 * The engine's shipped tool defaults, name for name (agent-workspace.js
 * TOOL_DEFAULTS). seedToolPermissions is INSERT OR IGNORE, so this only ADDS
 * the tools you have never decided about; it never overrides a choice.
 * `document_search`/`cron_add` are not tool names — the real ones are
 * `search_documents`/`list_documents` and `manage_cron`.
 */
const DEFAULT_TOOL_PERMISSIONS = [
  ['read_file', 'always_allow'], ['list_files', 'always_allow'], ['find_files', 'always_allow'], ['grep_files', 'always_allow'],
  ['git_status', 'always_allow'], ['git_log', 'always_allow'], ['git_diff', 'always_allow'], ['memory_recall', 'always_allow'],
  ['memory_search', 'always_allow'], ['memory_list', 'always_allow'], ['write_file', 'always_ask'], ['edit_file', 'always_ask'],
  ['delete_file', 'always_ask'], ['execute_command', 'always_ask'], ['git_init', 'always_ask'], ['git_add', 'always_ask'],
  ['git_commit', 'always_ask'], ['web_fetch', 'always_ask'], ['manage_cron', 'always_ask'], ['memory_store', 'always_ask'],
  ['memory_forget', 'always_ask'], ['search_documents', 'always_allow'], ['list_documents', 'always_allow'],
  ['index_document', 'always_ask'], ['forget_document', 'always_ask'],
].map(([toolName, permission]) => ({ toolName, permission, enabled: true }));
const PERMISSIONS = [['always_allow', 'Always allow'], ['always_ask', 'Always ask'], ['always_ask_biometric', 'Ask + fingerprint']];

/** Methods whose arguments must never reach the local event log. */
const SECRET_METHODS = new Set(['setAuthKey', 'exchangeOAuthCode']);

const nativeKit = () => (typeof window !== 'undefined' ? window.NativeKit : undefined);

function parseMaybeJSON(value, fallback) {
  if (value === undefined || value === null || value === '') return fallback;
  if (typeof value !== 'string') return value;
  try { return JSON.parse(value); } catch { return fallback; }
}

/** Blanks keys and tokens before anything is written to the local event log. */
function redactSecrets(value, max = 2000) {
  let text = typeof value === 'string' ? value : (() => { try { return JSON.stringify(value); } catch { return String(value); } })();
  text = String(text ?? '')
    .replace(/(authorization"?\s*[:=]\s*"?)(bearer\s+)?[^"\s,}]+/gi, '$1[redacted]')
    .replace(/\b(sk-[A-Za-z0-9_-]{8,}|sk-ant-[A-Za-z0-9_-]{8,}|AIza[0-9A-Za-z_-]{20,}|gh[pousr]_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16})\b/g, '[redacted]')
    .replace(/("(?:apiKey|api_key|key|token|secret|password)"\s*:\s*")[^"]*"/gi, '$1[redacted]"');
  return text.length > max ? `${text.slice(0, max)}…` : text;
}

/** Local event log, same key and size limit as agent.html. */
const eventLog = {
  entries: (() => { try { const v = JSON.parse(localStorage.getItem(EVENT_LOG_KEY) || '[]'); return Array.isArray(v) ? v.slice(-EVENT_LOG_MAX) : []; } catch { return []; } })(),
  add(kind, detail) {
    this.entries.push({ at: Date.now(), kind, detail: redactSecrets(detail, 1200) });
    if (this.entries.length > EVENT_LOG_MAX) this.entries.splice(0, this.entries.length - EVENT_LOG_MAX);
    try { localStorage.setItem(EVENT_LOG_KEY, JSON.stringify(this.entries)); } catch { /* storage blocked */ }
  },
  clear() { this.entries = []; try { localStorage.removeItem(EVENT_LOG_KEY); } catch { /* storage blocked */ } },
};

/**
 * The one adapter. Method names and argument shapes match agent.html's calls:
 * NativeKit.agent.*, NativeKit.secureStorage.*, NativeKit.preferences.*, NativeKit.biometric.*
 */
const bridge = {
  get available() { return !!nativeKit()?.agent; },
  agent() {
    const a = nativeKit()?.agent;
    if (!a) throw new Error(NATIVE_ONLY);
    return a;
  },
  /** Generic agent call, as agent.html's `call(name, ...args)`. */
  async call(method, ...args) {
    const a = this.agent();
    if (typeof a[method] !== 'function') throw new Error(`This app version has no agent.${method}().`);
    const secret = SECRET_METHODS.has(method);
    eventLog.add('call', `${method}(${secret ? '[redacted]' : redactSecrets(args, 300)})`);
    return a[method](...args);
  },
  async supported() {
    const a = nativeKit()?.agent;
    if (!a) return false;
    if (typeof a.supported !== 'function') return true;
    try { return !!(await a.supported()); } catch { return false; }
  },
  checkAvailability() { return this.call('checkAvailability'); },
  initialize() { return this.call('initialize', AGENT_PATHS); },
  onEvent(cb) { return this.agent().onEvent(cb); },
  async listSessions() {
    const r = await this.call('listSessions', AGENT_ID);
    const list = parseMaybeJSON(r?.sessionsJson, []);
    return Array.isArray(list) ? list : [];
  },
  async loadSession(sessionKey) {
    const r = await this.call('loadSession', sessionKey, AGENT_ID);
    const list = parseMaybeJSON(r?.messagesJson, []);
    return Array.isArray(list) ? list : [];
  },
  resumeSession(sessionKey) { return this.call('resumeSession', { sessionKey, agentId: AGENT_ID }); },
  sendMessage({ prompt, sessionKey, provider, model }) {
    return this.call('sendMessage', { prompt, sessionKey, provider, ...(model ? { model } : {}) });
  },
  followUp(text) { return this.call('followUp', text); },
  abort() { return this.call('abort'); },
  respondToApproval(toolCallId, approved, reason) { return this.call('respondToApproval', toolCallId, approved, reason); },
  /** agent.invokeTool(name, args) -> { resultJson }; a result with `error` throws, like agent.html. */
  async invokeTool(name, args) {
    const r = await this.call('invokeTool', name, args);
    const out = parseMaybeJSON(r?.resultJson, r?.resultJson ?? null);
    if (out && typeof out === 'object' && out.error) throw new Error(String(out.error));
    return out;
  },
  connectMcp(servers) { return this.call('connectMcp', servers, { withDeviceTools: true }); },
  /* settings */
  getAuthStatus(provider) { return this.call('getAuthStatus', provider); },
  setAuthKey(key, provider) { return this.call('setAuthKey', key, provider); },
  deleteAuth(provider) { return this.call('deleteAuth', provider); },
  async getModels(provider) {
    if (provider === 'auto') return FREE_ROUTES.map((r) => ({ id: r.model, name: r.label, isFree: true, provider: r.provider }));
    if (provider === 'webllm') return [];
    const r = await this.call('getModels', provider);
    const list = parseMaybeJSON(r?.modelsJson, []);
    return (Array.isArray(list) ? list : []).slice(0, 500);
  },
  getRuntimeConfig() { return this.call('getRuntimeConfig'); },
  setRuntimeConfig(config) { return this.call('setRuntimeConfig', config); },
  async listToolPermissions() {
    const r = await this.call('listToolPermissions');
    const list = parseMaybeJSON(r?.permissionsJson, []);
    return (Array.isArray(list) ? list : []).map((p) => ({
      toolName: p.toolName ?? p.tool_name ?? p.name, permission: p.permission ?? p.policy ?? 'always_ask', enabled: p.enabled !== false,
    })).filter((p) => p.toolName);
  },
  setToolPermission(toolName, permission, enabled) { return this.call('setToolPermission', toolName, permission, enabled); },
  seedToolPermissions() { return this.call('seedToolPermissions', DEFAULT_TOOL_PERMISSIONS); },
  resetToolPermissions() { return this.call('resetToolPermissions'); },
  /* automations and skills */
  async listCronJobs() { const r = await this.call('listCronJobs'); const v = parseMaybeJSON(r?.jobsJson, []); return Array.isArray(v) ? v : []; },
  async loadSurfacedMessages(limit = 30) { const r = await this.call('loadSurfacedMessages', limit); const v = parseMaybeJSON(r?.messagesJson, []); return Array.isArray(v) ? v : []; },
  getWakeStatus() { return this.call('getWakeStatus'); },
  getSchedulerConfig() { return this.call('getSchedulerConfig'); },
  async listSkills() { const r = await this.call('listSkills'); const v = parseMaybeJSON(r?.skillsJson, []); return Array.isArray(v) ? v : []; },
  addCronJob(job) { return this.call('addCronJob', job); },
  updateCronJob(id, patch) { return this.call('updateCronJob', id, patch); },
  removeCronJob(id) { return this.call('removeCronJob', id); },
  async runCronJob(id) { await this.call('runCronJob', id); return this.call('handleWake', 'user_workspace'); },
  setHeartbeatConfig(config) { return this.call('setHeartbeatConfig', config); },
  scheduleBackgroundWakes(minutes) { return this.call('scheduleBackgroundWakes', minutes); },
  cancelBackgroundWakes() { return this.call('cancelBackgroundWakes'); },
  clearSurfacedMessages() { return this.call('clearSurfacedMessages'); },
  addSkill(skill) { return this.call('addSkill', skill); },
  /** startSkill(skillId, config = {}, provider?) — runs in its OWN session; returns { sessionKey }. */
  startSkill(id, provider) { return this.call('startSkill', id, {}, provider || undefined); },
  removeSkill(id) { return this.call('removeSkill', id); },
  /* secure storage, preferences, biometric */
  async secureGet(key) { const s = nativeKit()?.secureStorage; if (!s?.get) return null; const v = await s.get(key); return typeof v === 'string' && v ? v : null; },
  async secureSet(key, value) { const s = nativeKit()?.secureStorage; if (!s?.set) throw new Error('Secure storage is not available in this app.'); return s.set(key, String(value)); },
  async secureRemove(key) { const s = nativeKit()?.secureStorage; if (s?.remove) await s.remove(key); },
  async prefsGet(key) { const p = nativeKit()?.preferences; if (!p?.getJSON) return null; const v = await p.getJSON(key); return v === undefined ? null : v; },
  async prefsSet(key, value) { const p = nativeKit()?.preferences; if (!p?.setJSON) throw new Error('Preferences are not available in this app.'); return p.setJSON(key, value); },
  async verifyBiometric(reason) {
    const b = nativeKit()?.biometric;
    if (!b?.verify) throw new Error('fingerprint or face check is not available');
    const r = await b.verify(reason);
    return !!r?.verified;
  },
};

/* ---------- MCP servers (stored in preferences, tokens in secure storage) ---------- */
const MCP_NAME = /^[A-Za-z][A-Za-z0-9_-]{0,63}$/;
const MCP_PROTOCOLS = [['auto', 'Auto'], ['2026-07-28', '2026-07-28'], ['2025-06-18', '2025-06-18 (older)']];
async function loadMcpServers() {
  const list = await bridge.prefsGet(MCP_SERVERS_KEY);
  return (Array.isArray(list) ? list : []).filter((s) => s && typeof s.name === 'string' && typeof s.url === 'string');
}
function validateMcpServer({ name, url }) {
  if (!MCP_NAME.test(name || '')) return 'The name must start with a letter and use only letters, numbers, - or _ (64 at most).';
  let u;
  try { u = new URL(url); } catch { return 'Enter a full https:// address.'; }
  if (u.protocol !== 'https:') return 'Only https:// servers are allowed.';
  if (u.username || u.password) return "Don't put a username or password in the address. Use the token field.";
  if (u.hash) return 'The address cannot contain a # part.';
  return null;
}
async function saveMcpServer(server, token) {
  const error = validateMcpServer(server);
  if (error) throw new Error(error);
  const list = (await loadMcpServers()).filter((s) => s.name !== server.name);
  const entry = { name: server.name, url: server.url, protocolVersion: server.protocolVersion || 'auto', alwaysAsk: server.alwaysAsk !== false };
  if (token) await bridge.secureSet(MCP_TOKEN_PREFIX + server.name, token);
  await bridge.prefsSet(MCP_SERVERS_KEY, [...list, entry]);
  return entry;
}
async function removeMcpServer(name) {
  const list = (await loadMcpServers()).filter((s) => s.name !== name);
  await bridge.prefsSet(MCP_SERVERS_KEY, list);
  await bridge.secureRemove(MCP_TOKEN_PREFIX + name);
}
/** Builds connectMcp's list exactly like agent.html and connects with device tools. */
async function connectMcpServers() {
  const configs = await loadMcpServers();
  const servers = [];
  for (const c of configs) {
    const token = await bridge.secureGet(MCP_TOKEN_PREFIX + c.name);
    servers.push({
      name: c.name, url: c.url, protocolVersion: c.protocolVersion || 'auto',
      approvalPolicy: c.alwaysAsk === false ? 'always_allow' : 'always_ask',
      ...(token ? { headers: { authorization: `Bearer ${token}` } } : {}),
    });
  }
  const r = await bridge.connectMcp(servers);
  // Keep the live connection so a reconnect can dispose the previous client.
  return { configs, toolCount: r?.toolCount ?? 0, failures: Array.isArray(r?.failures) ? r.failures : [], connection: r };
}

/* ---------- converting the engine's messages into this UI's message parts ---------- */
function textOfContent(content) {
  if (typeof content === 'string') return { text: content, thinking: '' };
  let text = '';
  let thinking = '';
  if (Array.isArray(content)) {
    for (const p of content) {
      if (!p || typeof p !== 'object') continue;
      const t = String(p.type || '').toLowerCase();
      if (t === 'text') text += p.text ?? '';
      else if (t === 'thinking' || t === 'reasoning') thinking += p.thinking ?? p.text ?? '';
    }
  }
  return { text, thinking };
}
function toolResultValue(output) {
  if (typeof output !== 'string') return output ?? '';
  const parsed = parseMaybeJSON(output, undefined);
  return parsed === undefined ? output : parsed;
}
/** Same idea as agent.html's converter: text, thinking, tool calls with their results. */
function convertEngineMessages(list) {
  const out = [];
  const results = new Map();
  for (const m of list) {
    for (const r of m?.tool_results || m?.toolResults || []) results.set(r.tool_call_id ?? r.toolCallId, r.output ?? r.result ?? r.content);
    if (m?.role === 'tool' && (m.tool_call_id || m.toolCallId)) results.set(m.tool_call_id ?? m.toolCallId, m.content);
  }
  let parent = null;
  for (const m of list) {
    if (!m || (m.role !== 'user' && m.role !== 'assistant')) continue;
    const { text: contentText, thinking: contentThinking } = textOfContent(m.content);
    const text = contentText || (typeof m.text === 'string' ? m.text : '');
    const thinking = contentThinking || (typeof m.thinking === 'string' ? m.thinking : '');
    const createdAt = Number(m.createdAt ?? m.timestamp) || Date.now();
    const content = [];
    if (m.role === 'assistant' && thinking) content.push({ type: 'reasoning', text: thinking });
    if (text) content.push({ type: 'text', text });
    if (m.role === 'assistant') {
      for (const c of m.tool_calls || m.toolCalls || []) {
        const id = c.id ?? c.toolCallId ?? uid();
        const args = parseMaybeJSON(c.input ?? c.args ?? c.arguments, {}) || {};
        const part = { type: 'tool-call', toolCallId: String(id), toolName: String(c.name ?? c.toolName ?? 'tool'), args, argsText: JSON.stringify(args) };
        if (results.has(id)) part.result = toolResultValue(results.get(id));
        content.push(part);
      }
    }
    if (!content.length) continue;
    const message = {
      id: uid(), role: m.role, createdAt, content,
      ...(m.role === 'user' ? { attachments: [] } : { status: { type: 'complete' } }),
      metadata: { custom: m.model ? { model: m.model } : {}, ...(m.usage ? { usage: m.usage } : {}) },
    };
    out.push([parent, message]);
    parent = message.id;
  }
  return out;
}

/* ---------- part helpers kept from the UI ---------- */
/** Status of one part, derived from the message status the way assistant-ui does it. */
function partStatus(message, index) {
  const part = message.content[index];
  const status = message.status || { type: 'complete' };
  if (part.type === 'tool-call') {
    if (part.result !== undefined) return part.isError ? { type: 'incomplete', reason: 'error' } : { type: 'complete' };
    if (part.approval && part.approval.approved === undefined && !part.approval.resolution) return { type: 'requires-action' };
    if (status.type === 'running' || status.type === 'requires-action') return { type: 'running' };
    return { type: 'incomplete', reason: status.reason === 'error' ? 'error' : 'cancelled' };
  }
  if (status.type === 'running' && index === message.content.length - 1) return { type: 'running' };
  return { type: 'complete' };
}

const messageText = (message) => message.content.filter((p) => p.type === 'text').map((p) => p.text).join('\n\n');
/** No browser-side tools: every tool runs in the native engine. */
const TOOLKIT = {};

/* ==========================================================================
   ThreadRuntime: one agent session (sessionKey). State comes from engine events.
   ========================================================================== */
class ThreadRuntime extends Emitter {
  constructor(id, host) {
    super();
    this.id = id;
    this.host = host;
    this.repository = new MessageRepository();
    this.suggestions = [];
    this._run = null;
    this.sessionReady = false;
  }

  get messages() { return this.repository.getMessages(); }
  get isEmpty() { return this.messages.length === 0; }
  get isRunning() { return !!this._run; }
  get headId() { return this.repository.headId; }

  _notify() { this.emit('change'); }
  _commit(parentId, message) {
    this.repository.addOrUpdateMessage(parentId, message);
    this._notify();
    return message;
  }

  /** Replaces the thread with messages from loadSession or agent.completed. */
  load(engineMessages) {
    const pairs = convertEngineMessages(engineMessages);
    this.repository.clear();
    for (const [parent, message] of pairs) this.repository.addOrUpdateMessage(parent, message);
    if (pairs.length) this.repository.switchToBranch(pairs[pairs.length - 1][1].id);
    this._notify();
  }

  /** Sends a prompt through sendMessage (new session) or resumeSession + followUp (existing session). */
  append({ text, attachments = [] }) {
    if (this.isRunning) return;
    if (!bridge.available) { this.host.notify(NATIVE_ONLY, 'error'); return; }
    const files = attachments.map((a) => (a.content || []).filter((c) => c.type === 'text').map((c) => c.text).join('')).filter(Boolean);
    const prompt = [text, ...files].filter(Boolean).join('\n\n');
    if (!prompt.trim()) return;
    const user = { id: uid(), role: 'user', createdAt: Date.now(), content: text ? [{ type: 'text', text }] : [], attachments, metadata: { custom: {} } };
    this.repository.addOrUpdateMessage(this.headId, user);
    this.repository.switchToBranch(user.id);
    this.emit('append', user);
    this._startAssistant(user.id);
    this.host.submit(this, prompt).catch((e) => this.fail(e?.message || String(e)));
  }

  _startAssistant(parentId) {
    const message = { id: uid(), role: 'assistant', createdAt: Date.now(), content: [], status: { type: 'running' }, metadata: { custom: { model: this.host.modelLabel() } } };
    this._run = { parentId, messageId: message.id };
    this._commit(parentId, message);
    this.emit('runStart', { parentId, resumed: false });
    return message;
  }

  /** The live assistant message; an event with no local run (a background run) opens one. */
  _live() {
    if (!this._run) this._startAssistant(this.headId);
    return this.repository.getMessage(this._run.messageId).message;
  }
  _update(fn) {
    const message = this._live();
    this._commit(this._run.parentId, fn(message));
  }
  _appendPart(type, delta) {
    if (!delta) return;
    this._update((m) => {
      const content = [...m.content];
      const last = content[content.length - 1];
      if (last && last.type === type) content[content.length - 1] = { ...last, text: last.text + delta };
      else content.push({ type, text: delta });
      return { ...m, content };
    });
  }
  _patchTool(toolCallId, patch, create) {
    this._update((m) => {
      const at = m.content.findIndex((c) => c.type === 'tool-call' && c.toolCallId === toolCallId);
      const content = [...m.content];
      if (at >= 0) content[at] = { ...content[at], ...patch };
      else if (create) content.push({ type: 'tool-call', toolCallId, toolName: 'tool', args: {}, argsText: '{}', ...patch });
      else return m;
      const waiting = content.some((c) => c.type === 'tool-call' && c.approval && c.approval.approved === undefined && !c.approval.resolution);
      return { ...m, content, status: waiting ? { type: 'requires-action', reason: 'tool-calls' } : { type: 'running' } };
    });
  }

  /* ---------- engine events ---------- */
  onThinking(text) { this._appendPart('reasoning', text); }
  onText(text) { this._appendPart('text', text); }
  onToolUse({ toolCallId, toolName, args }) {
    const a = parseMaybeJSON(args, {}) || {};
    this._patchTool(String(toolCallId || uid()), { toolName: String(toolName || 'tool'), args: a, argsText: JSON.stringify(a) }, true);
  }
  onToolResult({ toolCallId, result, isError: explicitError }) {
    const value = toolResultValue(result);
    const isError = explicitError === true || !!(value && typeof value === 'object' && value.error && Object.keys(value).length <= 3);
    this._patchTool(String(toolCallId), { result: value, isError }, true);
  }
  onApproval({ toolCallId, toolName, args, requireBiometric }) {
    const a = parseMaybeJSON(args, {}) || {};
    this._patchTool(String(toolCallId), { toolName: String(toolName || 'tool'), args: a, argsText: JSON.stringify(a), approval: { id: String(toolCallId), requireBiometric: !!requireBiometric } }, true);
    this.emit('approval', { toolCallId, toolName });
  }
  onModel(label) {
    if (!label) return;
    this._update((m) => ({ ...m, metadata: { ...m.metadata, custom: { ...m.metadata?.custom, model: label } } }));
  }
  onCompleted(engineMessages) {
    const run = this._run;
    this._run = null;
    this.sessionReady = true;
    if (Array.isArray(engineMessages) && engineMessages.length) this.load(engineMessages);
    else if (run) {
      const m = this.repository.getMessage(run.messageId)?.message;
      if (m) this._commit(run.parentId, { ...m, status: { type: 'complete' } });
    }
    const last = this.messages[this.messages.length - 1];
    this.emit('runEnd', { messageId: last?.role === 'assistant' ? last.id : null });
  }
  fail(error) {
    const message = this._live();
    const content = message.content.map((c) => (c.type === 'tool-call' && c.approval && c.approval.approved === undefined ? { ...c, approval: { ...c.approval, resolution: 'cancelled' } } : c));
    this._commit(this._run.parentId, { ...message, content, status: { type: 'incomplete', reason: 'error', error: redactSecrets(error, 600) } });
    const id = message.id;
    this._run = null;
    this.emit('runEnd', { messageId: id });
  }

  /* ---------- user actions ---------- */
  cancelRun() {
    if (!this._run) return;
    bridge.abort().catch((e) => eventLog.add('error', `abort: ${e?.message || e}`));
    const message = this._live();
    const content = message.content.map((c) => (c.type === 'tool-call' && c.approval && c.approval.approved === undefined ? { ...c, approval: { ...c.approval, resolution: 'cancelled' } } : c));
    this._commit(this._run.parentId, { ...message, content, status: { type: 'incomplete', reason: 'cancelled' } });
    this._run = null;
    this.emit('runEnd', { messageId: message.id });
  }

  /** Approve or deny through respondToApproval; a biometric-gated tool asks for the fingerprint first. */
  async respondToToolApproval({ approvalId, approved, optionId }) {
    const message = this._run && this.repository.getMessage(this._run.messageId)?.message;
    const part = message?.content.find((c) => c.type === 'tool-call' && c.approval?.id === approvalId);
    if (!part || part.approval.approved !== undefined) return;
    let ok = !!approved;
    let reason = ok ? undefined : DENIED_REASON;
    if (ok && part.approval.requireBiometric) {
      try {
        ok = await bridge.verifyBiometric(part.toolName);
        if (!ok) reason = 'Biometric verification did not succeed; action denied.';
      } catch (e) {
        ok = false;
        reason = `Biometric unavailable: ${e?.message || e}`;
      }
    }
    this._patchTool(approvalId, { approval: { ...part.approval, approved: ok } }, false);
    try {
      await bridge.respondToApproval(approvalId, ok, ok ? undefined : reason);
      if (ok && optionId === 'allow-always' && !part.approval.requireBiometric) {
        await bridge.setToolPermission(part.toolName, 'always_allow', true);
        this.host.notify(`${part.toolName} will run without asking from now on.`, 'success');
      }
      if (!ok && reason !== DENIED_REASON) this.host.notify(reason, 'error');
    } catch (e) {
      this.host.notify(e?.message || 'The answer could not be sent to the agent.', 'error');
    }
  }

}

/* ==========================================================================
   ChatRuntime: boots the native agent, routes its events and owns the sessions.
   ========================================================================== */
class ChatRuntime extends Emitter {
  constructor(settings) {
    super();
    this.settings = settings;
    this.items = new Map();
    this.runtimes = new Map();
    this.mainId = null;
    this.titles = (() => { const t = storage.get('sessionTitles'); return t && typeof t === 'object' ? t : {}; })();
    this.native = { phase: 'starting', message: 'Starting the agent…', abi: null, mcp: { configs: [], toolCount: 0, failures: [] } };
    this.switchToNewThread();
    queueMicrotask(() => this.boot());
  }

  get ready() { return this.native.phase === 'ready'; }
  _setNative(patch) { Object.assign(this.native, patch); this.emit('native'); }

  async boot() {
    if (!(await bridge.supported())) {
      this._setNative({ phase: 'unavailable', message: NATIVE_ONLY });
      return;
    }
    try {
      const avail = await bridge.checkAvailability();
      if (avail && avail.available === false) {
        this._setNative({ phase: 'unavailable', message: avail.reason || 'The agent engine is not available on this device.', abi: avail.abi ?? null });
        return;
      }
      if (!window.__nativeKitAgentInitialized) {
        await bridge.initialize();
        window.__nativeKitAgentInitialized = true;
      }
      this._unsubscribe?.();
      const sub = await bridge.onEvent((e) => this._onEvent(e));
      this._unsubscribe = typeof sub === 'function' ? sub : (sub?.remove ? () => sub.remove() : null);
      this._setNative({ phase: 'ready', message: 'Agent ready', abi: avail?.abi ?? null });
      await this.settings.refreshFromNative();
      await this.refreshSessions();
      await this._restoreActive();
      this.reconnectMcp().catch(() => {});
    } catch (e) {
      eventLog.add('error', `boot: ${e?.message || e}`);
      this._setNative({ phase: 'error', message: redactSecrets(e?.message || String(e), 400) });
    }
  }

  async reconnectMcp() {
    try {
      const previous = this.native.mcp?.connection;
      if (previous && typeof previous.dispose === 'function') {
        try { previous.dispose(); } catch { /* already gone */ }
      }
      const mcp = await connectMcpServers();
      this._setNative({ mcp });
      return mcp;
    } catch (e) {
      this._setNative({ mcp: { ...this.native.mcp, failures: [{ name: 'MCP', error: e?.message || String(e) }] } });
      throw e;
    }
  }

  async _restoreActive() {
    let key = null;
    try { key = localStorage.getItem(ACTIVE_SESSION_KEY); } catch { /* storage blocked */ }
    const known = [...this.items.values()].filter((t) => t.status === 'regular');
    if (!key || !this.items.has(key)) key = known[0]?.id || null;
    if (key && this.main.isEmpty) await this.openSession(key);
  }

  /** listSessions('main') -> sidebar items. Titles are local labels only. */
  async refreshSessions() {
    if (!this.ready) return;
    try {
      const sessions = await bridge.listSessions();
      const seen = new Set();
      for (const s of sessions) {
        const id = s?.sessionKey;
        if (!id) continue;
        seen.add(id);
        const updated = Number(s.updatedAt) || (typeof s.updatedAt === 'string' ? Date.parse(s.updatedAt) : 0) || 0;
        const route = [s.provider, s.model].filter(Boolean).join(' · ');
        const prev = this.items.get(id);
        this.items.set(id, { id, title: this.titles[id] || route || id, createdAt: prev?.createdAt || updated, lastMessageAt: updated, status: 'regular', provider: s.provider, model: s.model });
      }
      for (const [id, item] of [...this.items]) if (item.status === 'regular' && !seen.has(id)) this.items.delete(id);
      this.emit('threads');
    } catch (e) {
      eventLog.add('error', `listSessions: ${e?.message || e}`);
    }
  }

  /** loadSession then resumeSession, as agent.html opens a chat. */
  async openSession(id) {
    const runtime = this.runtimeFor(id);
    try {
      const messages = await bridge.loadSession(id);
      await bridge.resumeSession(id);
      runtime.load(messages);
      runtime.sessionReady = true;
      this._dropEmptyNew(id);
      this.mainId = id;
      try { localStorage.setItem(ACTIVE_SESSION_KEY, id); } catch { /* storage blocked */ }
      this.emit('main');
      this.emit('threads');
    } catch (e) {
      this.notify(e?.message || 'That chat could not be opened.', 'error');
    }
  }

  /* ---------- events ---------- */
  _onEvent(event) {
    const type = event?.eventType ?? event?.type ?? '';
    const n = parseMaybeJSON(event?.payloadJson ?? event?.payload, {}) || {};
    eventLog.add(type || 'event', n);
    if (/^(cron\.|heartbeat\.|wake\.)/.test(type)) { this.emit('automation', { type, payload: n }); return; }
    const main = this.main;
    const mine = !n.sessionKey || n.sessionKey === main.id;
    if (type === 'approval_request') {
      // Not filtered by session in agent.html either: an approval always reaches the open chat.
      main.onApproval({
        toolCallId: n.toolCallId ?? n.tool_call_id, toolName: n.toolName ?? n.tool_name,
        args: n.args ?? n.input, requireBiometric: n.requireBiometric ?? n.require_biometric,
      });
      return;
    }
    if (type === 'agent.completed') {
      if (!mine) { this.refreshSessions(); return; }
      const list = parseMaybeJSON(n.displayMessagesJson, null);
      main.onCompleted(Array.isArray(list) ? list : null);
      if (this.items.get(main.id)?.status === 'new') this.items.get(main.id).status = 'regular';
      try { localStorage.setItem(ACTIVE_SESSION_KEY, main.id); } catch { /* storage blocked */ }
      this.refreshSessions();
      return;
    }
    if (!mine) return;
    switch (type) {
      case 'thinking': case 'thinking_delta': case 'reasoning_delta':
        main.onThinking(n.text ?? n.delta ?? n.thinking ?? ''); break;
      case 'text_delta': case 'assistant_delta':
        main.onText(n.text ?? n.delta ?? ''); break;
      case 'tool_use': case 'mcp_tool_call':
        main.onToolUse({ toolCallId: n.toolCallId ?? n.tool_call_id, toolName: n.toolName ?? n.tool_name, args: n.args ?? n.input }); break;
      case 'tool_result': {
        const raw = n.result ?? n.output;
        const value = raw && typeof raw === 'object' && 'output' in raw ? raw.output : raw;
        const isError = (raw && typeof raw === 'object' && (raw.isError === true || raw.is_error === true))
          || (value && typeof value === 'object' && (value.error || value.isError === true));
        main.onToolResult({ toolCallId: n.toolCallId ?? n.tool_call_id, result: value, isError });
        break;
      }
      case 'provider.route': case 'provider.selected': case 'provider.route_pinned': {
        const provider = n.provider ?? n.selectedProvider;
        const model = n.resolvedModel ?? n.model ?? n.selectedModel;
        main.onModel([provider, model].filter(Boolean).join(' / '));
        break;
      }
      case 'provider.fallback': {
        // {fromProvider, fromModel, toProvider, toModel}: only sent for a
        // retryable failure, before the user sees any streamed text.
        const to = [n.toProvider, n.toModel].filter(Boolean).join(' / ');
        if (to) main.onModel(`${to} (fallback)`);
        break;
      }
      case 'retry': {
        // {attempt, delayMs}
        const wait = Number(n.delayMs) > 0 ? ` in ${Math.round(Number(n.delayMs) / 1000)}s` : '';
        this.notify(`The provider asked to retry; attempt ${Number(n.attempt) || 1}${wait}.`, 'info');
        break;
      }
      case 'max_turns_reached': {
        // {turns}: the run stopped on the turn cap with no final answer.
        const turns = Number(n.turns);
        const text = `The run stopped after ${Number.isFinite(turns) ? turns : 'the maximum number of'} turns. Raise Max turns in Agent settings, then try again.`;
        if (main.isRunning) main.fail(text); else this.notify(text, 'error');
        break;
      }
      case 'context.compacted': case 'context.trimmed': {
        // Compaction happens inside the engine; the transcript it shows you
        // afterwards is the authoritative one.
        this.notify('Older context was summarised to fit the model window.', 'info');
        break;
      }
      case 'web_search_start': {
        // The engine's web search is not a tool_call, so give it a card of its
        // own and remember the id for the matching completion event.
        this._searchId = `search-${Date.now()}`;
        main.onToolUse({ toolCallId: this._searchId, toolName: 'web_search', args: { query: n.query } });
        break;
      }
      case 'web_search_complete': {
        main.onToolResult({ toolCallId: this._searchId || `search-${Date.now()}`, result: { results: Number(n.resultsCount) || 0 } });
        break;
      }
      case 'agent.error': case 'agent.background_timeout': {
        // fail() opens a live assistant message when none is running, so an
        // error that belongs to a finished (or background) run is reported
        // instead of being written into the open transcript.
        const text = n.error ?? n.message ?? 'The agent stopped with an error.';
        if (main.isRunning) main.fail(text); else this.notify(String(text), 'error');
        this.refreshSessions();
        break;
      }
      default: break;
    }
  }

  /* ---------- host interface used by ThreadRuntime ---------- */
  _host() {
    return {
      modelLabel: () => this.settings.modelLabel(),
      notify: (text, type) => this.notify(text, type),
      submit: (runtime, prompt) => this.submit(runtime, prompt),
    };
  }
  notify(text, type = 'error') { this.emit('notify', { text, type }); }

  async submit(runtime, prompt) {
    const item = this.items.get(runtime.id);
    if (item && !this.titles[runtime.id]) {
      const first = prompt.split('\n').find((l) => l.trim()) || 'New Chat';
      this.titles[runtime.id] = truncate(first.trim(), 60);
      item.title = this.titles[runtime.id];
      storage.set('sessionTitles', this.titles);
    }
    if (item) { item.lastMessageAt = Date.now(); this.emit('threads'); }
    if (runtime.sessionReady) {
      await bridge.resumeSession(runtime.id);
      await bridge.followUp(prompt);
    } else {
      const provider = this.settings.get('provider') || 'auto';
      const model = provider === 'auto' ? '' : this.settings.get('model');
      await bridge.sendMessage({ prompt, sessionKey: runtime.id, provider, model });
    }
  }

  /* ---------- threads ---------- */
  get main() { return this.runtimeFor(this.mainId); }
  get mainItem() { return this.items.get(this.mainId); }
  runtimeFor(id) {
    let runtime = this.runtimes.get(id);
    if (!runtime) {
      runtime = new ThreadRuntime(id, this._host());
      runtime.on('append', () => {
        const item = this.items.get(id);
        if (item && item.status === 'new') { item.status = 'regular'; this.emit('threads'); }
      });
      this.runtimes.set(id, runtime);
    }
    return runtime;
  }
  threads(status) {
    return [...this.items.values()].filter((t) => t.status === status).sort((a, b) => b.lastMessageAt - a.lastMessageAt);
  }
  flush() { this.settings._persist(); }

  switchToThread(id) {
    if (!this.items.has(id) || id === this.mainId) return;
    if (this.main.isRunning) { this.notify('Stop the current reply before opening another chat.', 'error'); return; }
    if (!this.ready) { this.notify(NATIVE_ONLY, 'error'); return; }
    this.openSession(id);
  }

  switchToNewThread() {
    const current = this.mainItem;
    if (current && current.status === 'new' && this.main.isEmpty) { this.emit('main'); return; }
    if (current && this.main.isRunning) { this.notify('Stop the current reply before starting a new chat.', 'error'); return; }
    const id = `chat-${Date.now()}`;
    this.items.set(id, { id, title: 'New Chat', createdAt: Date.now(), lastMessageAt: Date.now(), status: 'new' });
    this.mainId = id;
    this.emit('main');
    this.emit('threads');
  }

  _dropEmptyNew(except) {
    const current = this.mainItem;
    if (current && current.status === 'new' && current.id !== except) {
      this.items.delete(current.id);
      this.runtimes.delete(current.id);
    }
  }

  /** A local label for the sidebar; the engine keeps no titles. */
  rename(id, title) {
    const item = this.items.get(id);
    const next = title.trim();
    if (!item || !next) return;
    item.title = this.titles[id] = truncate(next, 80);
    storage.set('sessionTitles', this.titles);
    this.emit('threads');
  }
}

/* ==========================================================================
   Settings: UI preferences in local storage, plus a cache of what the native
   engine reports (key status per provider, model lists).
   ========================================================================== */
const DEFAULT_SETTINGS = { theme: 'system', provider: 'auto', model: '', submitMode: 'enter', sidebarOpen: true, voiceLang: 'bn-BD', followups: false, providerOrder: [] };
function sanitizeSettings(raw) {
  const s = { ...DEFAULT_SETTINGS };
  if (!raw || typeof raw !== 'object') return s;
  if (['system', 'light', 'dark'].includes(raw.theme)) s.theme = raw.theme;
  if (AGENT_PROVIDERS.some((p) => p.id === raw.provider)) s.provider = raw.provider;
  if (typeof raw.model === 'string') s.model = raw.model.slice(0, 200);
  if (['enter', 'ctrlEnter'].includes(raw.submitMode)) s.submitMode = raw.submitMode;
  if (typeof raw.sidebarOpen === 'boolean') s.sidebarOpen = raw.sidebarOpen;
  if (typeof raw.voiceLang === 'string' && raw.voiceLang) s.voiceLang = raw.voiceLang.slice(0, 20);
  s.followups = false;
  if (Array.isArray(raw.providerOrder)) s.providerOrder = raw.providerOrder.filter((id) => KEY_PROVIDERS.some((p) => p.id === id));
  return s;
}

class Settings extends Emitter {
  constructor() {
    super();
    this.values = sanitizeSettings(storage.get('settings'));
    this.auth = {};
    this.models = {};
    this._save = debounce(() => storage.set('settings', this.values), 300);
  }
  get(key) { return this.values[key]; }
  set(patch) {
    this.values = sanitizeSettings({ ...this.values, ...patch });
    this._save();
    this.emit('change', patch);
  }
  _persist() { storage.set('settings', this.values); }
  get provider() { return agentProvider(this.values.provider); }
  /** Providers in the order the user dragged them into; ones never moved keep agent.html's order. */
  orderedProviders() {
    const order = this.values.providerOrder || [];
    const rank = (p) => { const i = order.indexOf(p.id); return i < 0 ? order.length + AGENT_PROVIDERS.indexOf(p) : i; };
    return [...AGENT_PROVIDERS].sort((a, b) => (a.needsKey && b.needsKey ? rank(a) - rank(b) : AGENT_PROVIDERS.indexOf(a) - AGENT_PROVIDERS.indexOf(b)));
  }

  /** Key status for every key provider, from getAuthStatus. */
  async refreshFromNative() {
    if (!bridge.available) return;
    await Promise.all(KEY_PROVIDERS.map(async (p) => {
      try {
        const r = await bridge.getAuthStatus(p.id);
        this.auth[p.id] = { hasKey: !!r?.hasKey, masked: r?.masked || '' };
      } catch (e) {
        this.auth[p.id] = { hasKey: false, masked: '', error: e?.message || String(e) };
      }
    }));
    this.emit('change', { auth: true });
  }
  async loadModels(id) {
    const list = await bridge.getModels(id);
    this.models[id] = list.filter((m) => m && m.id);
    this.emit('change', { models: true });
    return this.models[id];
  }
  modelsFor(id) { return this.models[id] || (id === 'auto' ? FREE_ROUTES.map((r) => ({ id: r.model, name: r.label, isFree: true })) : []); }
  status(id) {
    const p = agentProvider(id);
    if (!bridge.available) return 'off';
    if (!p.needsKey) return 'connected';
    const a = this.auth[id];
    if (a?.error) return 'error';
    return a?.hasKey ? 'connected' : 'off';
  }
  statusLabel(id) {
    const p = agentProvider(id);
    if (!bridge.available) return 'App only';
    if (p.id === 'auto') return 'No key needed';
    if (p.local) return 'On device';
    switch (this.status(id)) {
      case 'connected': return this.auth[id]?.masked ? `Key ${this.auth[id].masked}` : 'Key saved';
      case 'error': return 'Status unknown';
      default: return 'Add an API key';
    }
  }
  /** Short label for the composer button. */
  modelLabel() {
    const p = this.provider;
    if (p.id === 'auto') return 'Free Router';
    return this.values.model || p.label;
  }
}

/* ==========================================================================
   UI building blocks: tooltip, popover/menu, dialog, toast, collapsible.
   Small stand-ins for the Radix/Base UI pieces assistant-ui composes with.
   ========================================================================== */
const portal = () => doc.getElementById('portal');

/** Positions a fixed element next to an anchor rect, flipping and shifting to stay on screen. */
function placeFloating(el, rect, { side = 'bottom', align = 'start', offset = 6, pad = 8 } = {}) {
  const vw = doc.documentElement.clientWidth;
  const vh = window.innerHeight;
  el.style.left = '0px';
  el.style.top = '0px';
  const w = el.offsetWidth;
  const ht = el.offsetHeight;
  const room = {
    bottom: vh - pad - (rect.bottom + offset + ht),
    top: rect.top - offset - ht - pad,
    right: vw - pad - (rect.right + offset + w),
    left: rect.left - offset - w - pad,
  };
  const opposite = { bottom: 'top', top: 'bottom', left: 'right', right: 'left' };
  if (room[side] < 0 && room[opposite[side]] > room[side]) side = opposite[side];
  const rtl = doc.documentElement.dir === 'rtl';
  let x;
  let y;
  if (side === 'bottom' || side === 'top') {
    y = side === 'bottom' ? rect.bottom + offset : rect.top - offset - ht;
    x = align === 'center' ? rect.left + rect.width / 2 - w / 2 : (align === 'start') !== rtl ? rect.left : rect.right - w;
  } else {
    x = side === 'right' ? rect.right + offset : rect.left - offset - w;
    y = align === 'center' ? rect.top + rect.height / 2 - ht / 2 : align === 'start' ? rect.top : rect.bottom - ht;
  }
  el.style.left = `${Math.round(clamp(x, pad, Math.max(pad, vw - w - pad)))}px`;
  el.style.top = `${Math.round(clamp(y, pad, Math.max(pad, vh - ht - pad)))}px`;
  el.dataset.side = side;
}

/* ---------- tooltip ---------- */
const Tooltip = (() => {
  let el = null;

  let pending = null;
  let timer = 0;
  let lastHide = 0;
  let watch = 0;

  function hide() {
    clearTimeout(timer);
    cancelAnimationFrame(watch);
    pending = null;
    if (!el) return;
    el.remove();
    el = null;
    current = null;
    lastHide = performance.now();
  }
  function show(target) {
    const text = target.getAttribute('data-tooltip');
    hide();
    if (!text || !target.isConnected) return;
    current = target;
    el = h('div', { class: 'tooltip', role: 'tooltip' }, text);
    portal().append(el);
    placeFloating(el, target.getBoundingClientRect(), { side: target.dataset.tooltipSide || 'bottom', align: 'center', offset: 6 });
    const check = () => {
      if (!current) return;
      if (!current.isConnected || current.getAttribute('data-tooltip') !== text) hide();
      else watch = requestAnimationFrame(check);
    };
    watch = requestAnimationFrame(check);
  }
  function init() {
    doc.addEventListener('pointerover', (e) => {
      if (e.pointerType === 'touch') return;
      const target = e.target.closest?.('[data-tooltip]');
      if (!target) { if (current || pending) hide(); return; }
      if (target === current || target === pending) return;
      hide();
      pending = target;
      timer = setTimeout(() => show(target), performance.now() - lastHide < 400 ? 60 : 400);
    });
    doc.addEventListener('focusin', (e) => {
      const target = e.target.closest?.('[data-tooltip]');
      if (target && target.matches(':focus-visible')) show(target);
    });
    doc.addEventListener('focusout', hide);
    doc.addEventListener('pointerdown', hide, true);
    doc.addEventListener('keydown', (e) => { if (e.key === 'Escape') hide(); }, true);
    doc.addEventListener('scroll', (e) => { if (current && e.target instanceof Node && e.target.contains(current)) hide(); }, true);
    window.addEventListener('blur', hide);
  }

})();
if (doc) doc.addEventListener('keydown', (e) => dialogKeys(e));

/* ---------- popover + menu ---------- */
let openLayer = null;
const closePopover = (restoreFocus = false) => openLayer?.close(restoreFocus);

function openPopover(trigger, build, opts = {}) {

  let closed = false;
  const close = (restoreFocus = true) => {
    if (closed) return;
    closed = true;
    doc.removeEventListener('pointerdown', onPointerDown, true);
    doc.removeEventListener('keydown', onKeyDown, true);
    doc.removeEventListener('scroll', reposition.schedule, true);
    window.removeEventListener('resize', reposition.schedule);
    reposition.cancel();

    el.remove();
    trigger.removeAttribute('data-state');
    trigger.setAttribute('aria-expanded', 'false');
    if (openLayer?.el === el) openLayer = null;

    else if (e.key === 'Tab' && el.contains(e.target) && opts.role === 'menu') { close(true); }
  };

  const reposition = frameScheduler(() => {

    const rect = trigger.getBoundingClientRect();
    if (!trigger.isConnected || rect.bottom < 0 || rect.top > window.innerHeight || (rect.width === 0 && rect.height === 0)) { close(false); return; }
    placeFloating(el, rect, opts);

  trigger.setAttribute('aria-expanded', 'true');
  doc.addEventListener('pointerdown', onPointerDown, true);
  doc.addEventListener('keydown', onKeyDown, true);

/** Arrow-key roving focus over `.menu-item` elements inside `root`. */

  if (e.key === 'ArrowDown') next = items[(at + 1) % items.length];
  else if (e.key === 'ArrowUp') next = items[at <= 0 ? items.length - 1 : at - 1];
  else if (e.key === 'Home') next = items[0];
  else if (e.key === 'End') next = items[items.length - 1];
  if (!next) return false;
  e.preventDefault();
  next.focus();
  next.scrollIntoView({ block: 'nearest' });
  return true;

/* ---------- dialog ---------- */
const dialogStack = [];

function openDialog({ title, description, body, footer, size, kind, label, align, onClose, initialFocus }) {
  closePopover();

  const returnFocus = doc.activeElement;
  const titleId = `dialog-${uid(6)}`;
  const panel = h('div', {
    class: 'dialog', role: 'dialog', 'aria-modal': 'true', tabindex: '-1',
    'aria-labelledby': title ? titleId : null, 'aria-label': title ? null : label,

  const close = () => {
    if (closed) return;
    closed = true;
    closePopover();
    overlay.remove();
    dialogStack.splice(dialogStack.indexOf(entry), 1);
    const below = dialogStack[dialogStack.length - 1];
    if (below) below.overlay.inert = false;
    else doc.getElementById('app').inert = false;
    if (returnFocus?.isConnected) returnFocus.focus({ preventScroll: true });
    onClose?.();
  };
  entry.close = close;

  if (title) {
    panel.append(h('div', { class: 'dialog-header' },
      h('h2', { class: 'dialog-title', id: titleId }, title),
      description && h('p', { class: 'dialog-description' }, description)));

  if (footer) panel.append(h('div', { class: 'dialog-footer' }, footer));

  let downOnOverlay = false;
  overlay.addEventListener('pointerdown', (e) => { downOnOverlay = e.target === overlay; });
  overlay.addEventListener('click', (e) => { if (downOnOverlay && e.target === overlay) close(); });
  entry.panel = panel;

  const below = dialogStack[dialogStack.length - 1];
  if (below) below.overlay.inert = true;
  else doc.getElementById('app').inert = true;
  dialogStack.push(entry);
  portal().append(overlay);
  const target = typeof initialFocus === 'function' ? initialFocus() : initialFocus;
  (target || panel).focus({ preventScroll: true });
  return { close, panel };
}

/** Escape and Tab for the top-most dialog, handled at the document so they work even if focus fell back to <body>. */
function dialogKeys(e) {
  const top = dialogStack[dialogStack.length - 1];
  if (!top || openLayer) return;
  if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); top.close(); return; }
  if (e.key !== 'Tab') return;
  const items = focusables(top.panel);
  if (!items.length) { e.preventDefault(); top.panel.focus(); return; }
  const first = items[0];
  const last = items[items.length - 1];
  const active = doc.activeElement;
  if (!top.panel.contains(active)) { e.preventDefault(); (e.shiftKey ? last : first).focus(); }
  else if (e.shiftKey && (active === first || active === top.panel)) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && active === last) { e.preventDefault(); first.focus(); }

function confirmDialog({ title, description, confirmLabel = 'Confirm', destructive = false, onConfirm }) {
  let dialog = null;

    type: 'button', class: `btn ${destructive ? 'btn-destructive' : 'btn-default'}`,
    onclick: () => { dialog.close(); onConfirm(); },

  const cancel = h('button', { type: 'button', class: 'btn btn-outline', onclick: () => dialog.close() }, 'Cancel');

/* ---------- toast ---------- */

    icon(type === 'error' ? 'circle-exclamation-point' : type === 'success' ? 'circle-check' : 'info'),
    h('span', null, message));

  while (host.children.length > 3) host.firstChild.remove();
  let timer = 0;
  const dismiss = () => {
    el.dataset.leaving = '';
    setTimeout(() => el.remove(), 160);
  };
  const arm = () => { timer = setTimeout(dismiss, duration ?? (type === 'error' ? 7000 : 4000)); };

/* ---------- collapsible ---------- */

    panel,
    get open() { return root.dataset.state === 'open'; },

}

function iconButton(tooltip, child, onClick, extra = {}) {
  return h('button', { type: 'button', class: 'aui-button-icon', 'data-tooltip': tooltip, 'aria-label': tooltip, onclick: onClick, ...extra }, child);
}

/* ---------- read aloud (assistant-ui: SpeechSynthesisAdapter) ---------- */
