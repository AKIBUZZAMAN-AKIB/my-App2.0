[package]
name = "native-agent-ffi"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "staticlib"]
name = "native_agent_ffi"

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

[dependencies]
uniffi = { version = "0.28", features = ["tokio", "cli"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "process", "io-util", "net"] }
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "json", "stream"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
async-trait = "0.1"
thiserror = "1"
tracing = "0.1"
futures = "0.3"
regex = "1"
glob = "0.3"
git2 = { version = "0.19", default-features = false, optional = true }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tiktoken-rs = "0.12.1"
sha2 = "0.10"

[features]
default = ["libgit2"]
libgit2 = ["dep:git2"]

# No [build-dependencies]: build.rs only prints rerun-if-changed and the
# scaffolding comes from uniffi::setup_scaffolding!() (proc macros). The old
# `uniffi` build-dependency was unused (Rust 1.100: cargo::unused_dependencies).

[profile.release]
opt-level = "z"
lto = "thin"
strip = true
